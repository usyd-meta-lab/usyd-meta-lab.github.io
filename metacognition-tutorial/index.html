<html lang="en">
<head>

<style>
:root{
  --accent:#e64626; --accent-dark:#b8321a; --accent-soft:#fdece7;
  --ink:#000000; --muted:#414141; --light:#8a8a8a; --line:#d9d9d9; --soft:#f6f6f6; --bg:#ffffff;
  --serif:'Times New Roman', Times, serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace;
  --sans:Arial,'Helvetica Neue',Helvetica,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.top{border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:13px;color:var(--accent)}
.brand b{color:var(--muted);font-weight:400}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px 80px}
.wrap.host{max-width:1280px}
h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin:0 0 10px}
h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;margin:0 0 8px}
h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 6px}
.label{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted)}
.tiny{font-size:12.5px;color:var(--light)}
.lede{font-size:18px;color:var(--muted);margin-bottom:18px}
.card{border:1px solid var(--line);padding:20px;margin:0 0 16px;background:#fff}
.card.soft{background:var(--soft)}
.btn{display:inline-block;background:var(--accent);color:#fff;border:1px solid var(--accent);padding:12px 18px;font-size:15px;text-decoration:none;text-align:center}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{display:block;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.prog{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.bar{height:3px;background:var(--line);margin-bottom:22px}
.bar i{display:block;height:3px;background:var(--accent)}
.q{font-family:var(--serif);font-size:26px;line-height:1.2;margin:4px 0 20px}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:#fff;padding:16px;text-align:left;font-size:17px}
.opt:hover{border-color:var(--ink)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chips.five{grid-template-columns:repeat(5,1fr)}
.chip{border:1px solid var(--line);background:#fff;padding:14px 0;font-family:var(--mono);font-size:15px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.anch{display:flex;justify-content:space-between;font-size:12px;color:var(--light);margin-top:6px}
.sub{margin-top:22px}
.txt{width:100%;font-size:20px;padding:14px;border:1px solid var(--line);outline:none}
.txt:focus{border-color:var(--accent)}
.center{text-align:center}
.big-wait{padding:50px 10px;text-align:center}
.big-wait h1{margin-bottom:8px}
.dotpulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:p 1.3s infinite;margin-right:8px;vertical-align:middle}
@keyframes p{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.teambtn{border:1px solid var(--line);background:#fff;padding:22px 10px;font-family:var(--serif);font-size:24px}

.join #qr img,.join #qr canvas{width:116px!important;height:116px!important}
.joinurl{font-family:var(--mono);font-size:17px;word-break:break-all}

.nbig{font-family:var(--serif);font-size:44px;line-height:1;text-align:right}
.phases{display:flex;gap:4px;flex-wrap:wrap}

.ph.done{color:var(--ink);border-color:#bbb}
.ph.h2{border-style:dashed}

.prompt{font-family:var(--serif);font-size:23px;color:var(--muted);margin:2px 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:#fff;padding:7px 12px;font-family:var(--mono);font-size:12px}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 0 4px}
.legend span i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:middle}
.keystats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.ks{border-top:2px solid var(--ink);padding-top:8px}
.ks .n{font-family:var(--serif);font-size:34px;line-height:1.1}
.ks .l{font-size:13.5px;color:var(--muted)}
.tutor{margin-top:18px;border-left:3px solid var(--line);padding:8px 14px;font-size:14px;color:var(--muted)}
.tutor b{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--accent);display:block;margin-bottom:2px;text-transform:uppercase}
.progress-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.pt{border:1px solid var(--line);padding:12px}
.pt .tn{font-family:var(--serif);font-size:22px}
.pt .bar{margin:8px 0 0}
.lb{width:100%;border-collapse:collapse;font-size:18px}
.lb td,.lb th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.lb th{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted)}
.lb td.r,.lb th.r{text-align:right;font-family:var(--mono)}
.lb tr:first-child td{font-weight:bold}
.controls{border-top:1px solid var(--line);padding-top:14px}
body.present .controls,body.present .tutor{display:none}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:700px){
  .stage{padding:16px}
  .stage h1{font-size:30px}
  .prompt{font-size:19px}
  .code,.nbig{font-size:32px}
}
</style>

async function makeFirebaseDB(code){
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
  const fs = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
  const app = initializeApp(firebaseConfig);
  const db = fs.initializeFirestore(app, { experimentalForceLongPolling: true });
  const sRef = fs.doc(db, ROOT, code);
  const rCol = fs.collection(db, ROOT, code, 'resp');
  const tCol = fs.collection(db, ROOT, code, 'teams');
  const colSnap = cb => snap => { const o = {}; snap.forEach(d => { o[d.id] = d.data(); }); cb(o); };
  return {
    setSession: p => fs.setDoc(sRef, p, { merge:true }),
    onSession: (cb, err) => fs.onSnapshot(sRef, s => cb(s.exists() ? s.data() : null), err),
    setResp: (id, p) => fs.setDoc(fs.doc(rCol, id), p, { merge:true }),
    onResps: (cb, err) => fs.onSnapshot(rCol, colSnap(cb), err),
    setTeam: (id, p) => fs.setDoc(fs.doc(tCol, id), p, { merge:true }),
    onTeams: (cb, err) => fs.onSnapshot(tCol, colSnap(cb), err),
    getSession: async () => { const d = await fs.getDoc(sRef); return d.exists() ? d.data() : null; },
    getTeams: async () => { const snap = await fs.getDocs(tCol); const o = {}; snap.forEach(d => { o[d.id] = d.data(); }); return o; },
    clear: async () => {
      for (const col of [rCol, tCol]){ const snap = await fs.getDocs(col); await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref))); }
      await fs.deleteDoc(sRef);
    }
  };
}

const r2Items = () => R2;
function r3Points(s){ let p = 0, all = 0, n = 0; R3.forEach(it => { const a = s.r3 && s.r3[it.id]; if (!a) return; n++; all += a.ok ? 1 : -2; if (a.play) p += a.ok ? 1 : -2; }); return { p, all, n }; }
function quizScore(s){
  let k = 0;
  R1.forEach(it => { if (s.r1 && s.r1[it.id] && s.r1[it.id].ok) k++; });
  R2.forEach(it => { if (s.r2 && s.r2[it.id] && s.r2[it.id].ok) k++; });
  R3.forEach(it => { if (s.r3 && s.r3[it.id] && s.r3[it.id].ok) k++; });
  R4.forEach(it => { if (s.r4p && s.r4p[it.id] && s.r4p[it.id].ok) k++; });

}
function confStats(s, items, key){

  const confs = tr.map(t => t.conf), acc = mean(tr.map(t => t.ok ? 1 : 0));
  const cR = tr.filter(t => t.ok).map(t => t.conf), cW = tr.filter(t => !t.ok).map(t => t.conf);

}

  switch (ph){
    case 'r1': return cnt(s.r1, R1, a => a.fok) === R1.length;
    case 'r2': return cnt(s.r2, R2) === R2.length;
    case 'r3': return cnt(s.r3, R3, a => 'play' in a) === R3.length;
    case 'r4': return cnt(s.r4p, R4) === R4.length;

/* =====================================================================
   SIMULATED CLASS (never written to the database)
   ===================================================================== */
function simulateClass(n, nTeams){
  const r = rng(hash('sim' + Date.now()));
  const resps = {}, teams = {};
  const people = [];
  for (let i = 0; i < n; i++){
    const id = 'sim' + i, a = randn(r), team = TEAM_NAMES[i % nTeams];
    const s = { team, sim:true, r1:{}, r2:{}, r3:{}, r4p:{}, est:{}, adv:{} };
    // signal-detection style trial: internal evidence x ~ N(d, 1); answer correct if x > 0; confidence grows with |x|.
    // Deceptive items have d < 0, so confident answers there are mostly wrong.
    const trial2 = pItem => {
      const pInd = clamp(logistic(logit(pItem) + 0.7 * a), .02, .98), d = logit(pInd) / 1.702, x = d + randn(r);
      const c = 50 + 50 * (2 * logistic(1.702 * 0.9 * Math.abs(x)) - 1) + 4 + randn(r) * 6;
      return { c: x > 0 ? 0 : 1, ok: x > 0, conf: clamp(Math.round(c / 10) * 10, 50, 100) };
    };
    // R1 + R3 recognition
    const recog = {};
    R1.forEach(it => {
      const pr = logistic(logit(it.p) + 0.8 * a), recalled = r() < pr;
      const k = randn(r);
      const fok = recalled ? (r() < .7 ? 5 : 4) : clamp(Math.round(3 + 1.1 * k + randn(r) * .6), 1, 5);
      s.r1[it.id] = { text: recalled ? it.accept[0] : '', ok: recalled, fok };
      recog[it.id] = recalled ? (r() < .95) : (r() < .25 + .75 * logistic(-0.7 + 1.3 * k + 0.4 * a));
    });
    R3.forEach(it => {
      const ok = it.fromR1 ? recog[it.id] : r() < (.25 + .75 * logistic(logit((it.p - .25) / .75) + 0.7 * a));
      const feel = it.fromR1 ? (s.r1[it.id].fok - 1) / 4 : (ok ? .65 : .35) + randn(r) * .2;
      const play = feel + randn(r) * .18 > .5;
      s.r3[it.id] = { c: ok ? 0 : 1 + Math.floor(r() * 3), ok, play };
    });
    R2.forEach(it => { s.r2[it.id] = trial2(it.p); });
    R4.forEach(it => { s.r4p[it.id] = trial2(it.p); });
    EST.forEach(it => {
      const z = randn(r) * (0.9 - 0.15 * a);
      const init = it.truth + z * it.scale;
      const conf = clamp(Math.round(3 + 0.4 * a - 0.6 * Math.abs(z) + randn(r) * .8), 1, 5);
      s.est[it.id] = { init: it.year ? Math.round(init) : Number(init.toPrecision(3)), conf };
    });
    resps[id] = s; people.push({ id, a, s });
  }
  // percentile estimates (weakly related to actual standing)
  const sc = percentiles(people.map(p => ({ id:p.id, score:quizScore(p.s) })));
  people.forEach(p => { p.s.pct = clamp(Math.round(58 + 0.25 * (sc[p.id] - 50) + randn(r) * 15), 1, 99); });
  // advice from other simulated students
  people.forEach(p => {
    const order = shuffle(EST.map(e => e.id), r);
    EST.forEach(it => {
      const type = order.indexOf(it.id) < EST.length / 2 ? 'one' : 'five';
      const others = shuffle(people.filter(q => q.id !== p.id), r).slice(0, type === 'one' ? 1 : 5);
      const advice = mean(others.map(q => q.s.est[it.id].init));
      const init = p.s.est[it.id].init, conf = p.s.est[it.id].conf;
      let w;
      const u = r();
      if (u < .33) w = 0; else if (u < .41) w = 1; else w = clamp(0.15 + 0.08 * (3 - conf) + (type === 'five' ? .04 : 0) + r() * .45, 0, 1);
      const final = init + w * (advice - init);
      p.s.adv[it.id] = { advice, type, final: it.year ? Math.round(final) : Number(final.toPrecision(3)) };
    });
  });
  // team answers in R4: sometimes follow the most confident member, otherwise majority
  for (let t = 0; t < nTeams; t++){
    const T = TEAM_NAMES[t], mem = people.filter(p => p.s.team === T); if (!mem.length) continue;
    const ans = {};
    R4.forEach(it => {
      const votes = mem.map(m => m.s.r4p[it.id]);
      let choice;
      if (r() < .45){ const top = votes.reduce((b, v) => v.conf > b.conf ? v : b, votes[0]); choice = top.c; }
      else { const k1 = votes.filter(v => v.c === 0).length; choice = k1 * 2 > votes.length ? 0 : k1 * 2 < votes.length ? 1 : (r() < .5 ? 0 : 1); }
      ans[it.id] = { c: choice, ok: choice === 0 };
    });
    teams[T] = { r4: ans, done:true };
  }
  return { resps, teams };
}

    const tr = teams[T] && teams[T].r4 ? R4.filter(it => teams[T].r4[it.id] && teams[T].r4[it.id].c === 0).length : 0;
    const bias = mean(mem.map(s => Math.abs(confStats(s, R2, 'r2').bias)).filter(fin));

function quartiles(list, key){ // list sorted by key ascending, split into 4 groups
  const s = list.slice().sort((a, b) => a[key] - b[key]); const q = [[], [], [], []];

}
function anaDK(){
  const st = students().filter(s => fin(s.pct));
  const pc = percentiles(students().map(s => ({ id:s.id, score:quizScore(s) })));
  const list = st.map(s => ({ id:s.id, actual:pc[s.id], est:s.pct, cs:confStats(s, R2, 'r2') }));
  const q = list.length >= 4 ? quartiles(list, 'actual') : null;

}
function simDK(n){
  const r = rng(99); const list = [];
  for (let i = 0; i < n; i++) list.push({ id:'x' + i, score: Math.round(24 + randn(r) * 5) + r() * .01, est: clamp(62 + randn(r) * 17, 1, 99) });
  const pc = percentiles(list); list.forEach(x => x.actual = pc[x.id]);

}
function anaAdvice(){
  const trials = [];
  students().forEach(s => EST.forEach(it => {
    const e = s.est && s.est[it.id], a = s.adv && s.adv[it.id]; if (!e || !a || !fin(a.final) || !fin(a.advice)) return;
    const d = a.advice - e.init; if (Math.abs(d) < 1e-9) return;
    const woa = clamp((a.final - e.init) / d, 0, 1);
    const err = x => Math.min(5, Math.abs(x - it.truth) / it.scale);
    trials.push({ woa, conf:e.conf, type:a.type, eInit:err(e.init), eFinal:err(a.final), eAvg:err((e.init + a.advice) / 2), eAdv:err(a.advice) });
  }));

}
function anaGroup(){
  const pool = students().filter(s => R2.filter(it => s.r2 && s.r2[it.id]).length >= R2.length - 2);
  const r = rng(2024), B = 300, k = Math.min(5, pool.length);
  const acc = { normal:{ avg:[], maj:[], cw:[], mc:[], best:[] }, deceptive:{ avg:[], maj:[], cw:[], mc:[], best:[] } };
  if (k < 3) return { acc, n: pool.length, k };
  const runGroup = grp => {
    const bestM = grp.reduce((b, s) => confStats(s, R2, 'r2').acc > confStats(b, R2, 'r2').acc ? s : b, grp[0]);
    R2.filter(it => it.type !== 'easy').forEach(it => {
      const votes = grp.map(s => s.r2 && s.r2[it.id]).filter(Boolean); const o = ruleOutcomes(votes); if (!o) return;

      acc[T].avg.push(o.avg); acc[T].maj.push(o.maj); acc[T].cw.push(o.cw); acc[T].mc.push(o.mc);
      const b = bestM.r2 && bestM.r2[it.id]; if (b) acc[T].best.push(b.ok ? 1 : 0);
    });
  };
  for (let b = 0; b < B; b++) runGroup(shuffle(pool, r).slice(0, k));

}

  return { key:'pers:' + ph + ':' + rows.length, html:`<div class="big-wait" style="padding:30px 0 10px"><div class="label">Team ${me.team}</div><h1>${title}</h1></div>
    ${rows ? `<div class="card"><div class="label" style="margin-bottom:6px">Just for you</div>${rows}</div><p class="tiny">Only you can see this. It is worked out on your phone from your own answers.</p>` : ''}` };
}

function hostStage(ph){

    case 'r1': return roundStage('Round 1', 'Tip of the tongue', 'Recall the answer if you can. Then say how likely you\'d be to recognise it among four options.', 'r1', 'Six questions. Nobody gets feedback yet: the same questions return as multiple choice in round 3.');
    case 'r2': return roundStage('Round 2', 'How sure are you?', 'Pick an answer, then say how sure you are. 50% means a pure guess.', 'r2', 'Sixteen two-choice questions. Some are deliberately deceptive. Encourage honest confidence ratings rather than safe ones.');
    case 'r3': return roundStage('Round 3', 'Pass or play', 'Right +1, wrong −2, pass 0. Choose your answer, then decide whether to play it.', 'r3', 'Ten questions, six of them the round 1 questions as multiple choice. Passing well is worth as much as knowing.');
    case 'r4': return roundStage('Round 4', 'Team round', 'First answer on your own, with confidence. Then agree a team answer together.', 'r4', 'Eight hard questions. Listen for how teams decide: who speaks first, whose confidence wins. You can refer back to it in reveal 4.');

function roundStage(lab, title, prompt, ph, note){

/* ---------- Hour 1 reveals ---------- */
function stageDebrief(){
  const t = tabs('debrief', [['fok','1 · Tip of the tongue'],['cal','2a · Calibration'],['res','2b · Bias vs resolution'],['pp','3 · Pass or play'],['team','4 · Teams'],['lb','Leaderboard']]);
  let body = '';
  if (t.cur === 'fok'){
    const d = anaFOK(); const vals = [1,2,3,4,5].map(k => d.by[k].length ? mean(d.by[k]) * 100 : NaN);
    const n = [1,2,3,4,5].reduce((a, k) => a + d.by[k].length, 0);
    body = `<div class="label">Reveal 1</div><h1>You couldn't recall it, but did you know you'd recognise it?</h1>
      <p class="prompt">Recognition accuracy in round 3 for answers students <em>couldn't</em> recall in round 1, split by their feeling of knowing.</p>${enough(n, 15)}
      ${barChart({ groups:['1','2','3','4','5','Recalled it'], groupSub:['Definitely not','','Maybe','','Definitely','(for comparison)'], series:[{ name:'Recognised', color:COL.accent, vals:vals.concat(d.rec.length ? mean(d.rec) * 100 : NaN) }], y0:0, y1:100, yTicks:tick(0, 100, 25), yFmt:v => v + '%', yLabel:'Picked the right option', vFmt:v => Math.round(v) + '%', hlines:[{ y:25, label:'Chance (1 in 4)' }], m:{ b:70 } })}
      ${keystats([{ n:n, l:'answers not recalled' }, { n: pct0(mean(d.by[4].concat(d.by[5]))), l:'recognised when FOK was 4 or 5' }, { n: pct0(mean(d.by[1].concat(d.by[2]))), l:'recognised when FOK was 1 or 2' }])}
      ${tutor('If the bars rise from left to right, people knew something about memories they could not retrieve. That is monitoring without retrieval (Hart, 1965), the tip-of-the-tongue state from Lecture 1. Ask: what were you monitoring, if not the answer itself?')}`;
  } else if (t.cur === 'cal'){
    const d = anaCalib(); const minN = students().length >= 12 ? 5 : 2; const line = k => CONF.map(c => [c, d.bins[k][c].length >= minN ? mean(d.bins[k][c]) * 100 : NaN, d.bins[k][c].length]);
    body = `<div class="label">Reveal 2a</div><h1>When you said 80%, were you right 80% of the time?</h1>
      <p class="prompt">Each dot is the class's accuracy at each confidence level. On the dashed line, confidence matches accuracy.</p>${enough(d.all.n, 80)}
      ${legend([{ name:'All questions', color:COL.ink }, { name:'Normal questions', color:COL.grey }, { name:'Deceptive questions', color:COL.accent }])}
      ${lineChart({ x0:50, x1:100, y0:0, y1:100, xTicks:CONF, yTicks:tick(0, 100, 25), xFmt:v => v + '%', yFmt:v => v + '%', xLabel:'Confidence', yLabel:'Actually correct', diag:true, showN:false,
        series:[{ name:'Normal', color:COL.grey, pts:line('normal') }, { name:'Deceptive', color:COL.accent, pts:line('deceptive') }, { name:'All', color:COL.ink, pts:line('all') }] })}
      ${keystats([{ n: Math.round(d.all.conf) + '% / ' + Math.round(d.all.acc) + '%', l:'average confidence / accuracy, all questions' }, { n: Math.round(d.dec.conf) + '% / ' + Math.round(d.dec.acc) + '%', l:'on the deceptive questions' }, { n: (d.all.conf - d.all.acc >= 0 ? '+' : '') + Math.round(d.all.conf - d.all.acc), l:'class over- (+) or underconfidence (−), points' }])}
      <p class="tiny">Confidence levels used fewer than ${minN} times are not plotted.</p>${tutor('Below the line is overconfidence. Expect the deceptive questions to sit well below it: confidence follows how an answer <em>feels</em>, not whether it is right. Which deceptive question fooled the room most? (Rome is further north than New York.)')}`;
  } else if (t.cur === 'res'){
    const d = anaCalib(); const pts = d.per.filter(p => fin(p.gap)).map(p => ({ x:clamp(p.bias, -40, 40), y:clamp(p.gap, -20, 45) }));
    body = `<div class="label">Reveal 2b</div><h1>Two different ways to be good</h1>
      <p class="prompt">Each dot is one student. Left–right: over- or underconfidence (bias). Up–down: how much more confident you were when right than when wrong (resolution).</p>${enough(pts.length, 8)}
      ${scatter({ pts, x0:-40, x1:40, y0:-20, y1:45, xTicks:tick(-40, 40, 20), yTicks:tick(-20, 40, 20), xLabel:'← underconfident     Bias (points)     overconfident →', yLabel:'Resolution: confidence right − wrong', zeroX:true, zeroY:true, jitter:1.5,
        labels:[{ x:-38, y:41, text:'Underconfident but discerning', anchor:'start' }, { x:38, y:41, text:'Overconfident but discerning', anchor:'end' }, { x:-38, y:-16, text:'Underconfident and undiscerning', anchor:'start' }, { x:38, y:-16, text:'Overconfident and undiscerning', anchor:'end' }] })}
      ${keystats([{ n: pts.length, l:'students' }, { n: pts.filter(p => p.y > 5).length, l:'were noticeably more confident when right' }, { n: pts.filter(p => Math.abs(p.x) < 5).length, l:'were within 5 points of perfect calibration' }])}
      ${tutor('Calibration and resolution are separate. Find a dot near the middle of the x-axis but low on the y-axis: perfectly calibrated on average, yet no idea which answers were right. Link to Lecture 1: this is the bias–sensitivity distinction behind meta-d′.')}`;
  } else if (t.cur === 'pp'){
    const d = anaPass(); const pts = d.per.map(p => ({ x:p.all, y:p.p }));

      <div style="display:grid;grid-template-columns:3fr 2fr;gap:20px;align-items:start">
      ${scatter({ W:620, H:480, pts, x0:-20, x1:10, y0:-20, y1:10, xTicks:tick(-20, 10, 5), yTicks:tick(-20, 10, 5), xLabel:'Score if you had played everything', yLabel:'Your actual score', diag:true, jitter:.6 })}
      ${barChart({ groups:['Played','Passed'], series:[{ name:'acc', color:COL.accent, vals:[mean(d.played) * 100, mean(d.passed) * 100] }], y0:0, y1:100, yTicks:tick(0, 100, 25), yFmt:v => v + '%', yLabel:'Chosen answer was right', vFmt:v => Math.round(v) + '%', W:420, H:480 })}
      </div>

  } else if (t.cur === 'team'){

      ${barChart({ groups:['Hard questions','Deceptive questions','All'], series: ser.map(s => ({ name:s[0], color:s[2], vals:[A(s[1], 'hard') * 100, A(s[1], 'deceptive') * 100, A(s[1]) * 100] })).concat([{ name:'Best', color:COL.dark, vals:[NaN, NaN, mean(d.rows.map(r => r.best)) * 100] }, { name:'Avg', color:COL.pale, vals:[A('avg', 'hard') * 100, A('avg', 'deceptive') * 100, A('avg') * 100] }]), y0:0, y1:100, yTicks:tick(0, 100, 25), yFmt:v => v + '%', yLabel:'Correct', vFmt:v => Math.round(v) + '%' })}
      <table class="lb" style="margin-top:12px;font-size:15px"><tr><th>Team</th><th class="r">Members</th><th class="r">Discussion</th><th class="r">Majority</th><th class="r">Confidence-weighted</th><th class="r">Best member</th></tr>
      ${d.rows.map(r => `<tr><td>Team ${r.T}</td><td class="r">${r.n}</td><td class="r">${pct0(mean(r.actual.filter(fin)))}</td><td class="r">${pct0(mean(r.maj))}</td><td class="r">${pct0(mean(r.cw))}</td><td class="r">${pct0(r.best)}</td></tr>`).join('')}</table>
      ${tutor('Ask each team how they decided. Did the most confident person win the argument? Did the team beat its best member (Bahrami et al., 2010)? Notice the deceptive questions: when everyone shares the same wrong intuition, combining people cannot fix it.')}`;

}
function leaderboard(){
  const lb = anaLeaderboard().sort((a, b) => b.total - a.total), cal = anaLeaderboard().filter(x => fin(x.bias)).sort((a, b) => a.bias - b.bias)[0];

function stageEnd(){

/* ---------- Hour 2 ---------- */
function stageDK(){
  const t = tabs('h2dk', [['a','a · The classic plot'],['b','b · Pure noise'],['c','c · A better test']]);
  const d = anaDK(); let body = '';
  const qlab = ['Bottom 25%','2nd','3rd','Top 25%'];
  const dkLines = q => lineChart({ x0:.5, x1:4.5, y0:0, y1:100, xTicks:[1,2,3,4], xFmt:v => qlab[v - 1], yTicks:tick(0, 100, 25), yFmt:v => v, xLabel:'Actual quiz performance (quartile)', yLabel:'Percentile', series:[{ name:'Actual', color:COL.ink, pts:q.map((g, i) => [i + 1, mean(g.map(x => x.actual))]) }, { name:'Estimated', color:COL.accent, pts:q.map((g, i) => [i + 1, mean(g.map(x => x.est))]) }] });
  if (t.cur === 'a'){
    body = `<div class="label">Part 1 · Yourself</div><h1>Do you know how good you are?</h1>
      <p class="prompt">Students grouped by their actual quiz score. Black: where they really ranked. Orange: where they thought they ranked.</p>${enough(d.list.length, 12)}
      ${legend([{ name:'Actual percentile', color:COL.ink }, { name:'Estimated percentile', color:COL.accent }])}
      ${d.q ? dkLines(d.q) : '<p class="muted">Needs at least four students with an estimate.</p>'}
      ${d.q ? keystats([{ n: Math.round(mean(d.q[0].map(x => x.est - x.actual))) , l:'bottom quarter: average overestimate (points)' }, { n: Math.round(mean(d.q[3].map(x => x.est - x.actual))), l:'top quarter: average over/underestimate' }, { n: Math.round(mean(d.list.map(x => x.est))), l:'average estimated percentile (true average is 50)' }]) : ''}
      ${tutor('The classic Dunning–Kruger pattern: the lowest scorers overestimate most. Before explaining it, ask the room: what would have to be true for this to show a metacognitive deficit? Then show tab b.')}`;
  } else if (t.cur === 'b'){
    const q = simDK(400);
    body = `<div class="label">Part 1 · Yourself</div><h1>The same plot, from people who know nothing about themselves</h1>
      <p class="prompt">400 simulated people. Their percentile guesses are random numbers, completely unrelated to how they did, with a slight better-than-average lean.</p>
      ${legend([{ name:'Actual percentile', color:COL.ink }, { name:'Estimated percentile (random)', color:COL.accent }])}
      ${dkLines(q)}
      ${tutor('Pure noise plus a better-than-average lean reproduces the "unskilled and unaware" pattern. Regression to the mean and bounded scales do the work (Lecture 2, Dunning–Kruger "handle with care"). So the classic plot cannot, on its own, show that low performers have worse metacognition.')}`;
  } else {
    const q = d.q; const vals = q ? q.map(g => mean(g.map(x => x.cs.gap).filter(fin))) : [];
    const bias = q ? q.map(g => mean(g.map(x => x.cs.bias).filter(fin))) : [];
    body = `<div class="label">Part 1 · Yourself</div><h1>A better test: item by item</h1>
      <p class="prompt">Instead of one global guess, use the round 2 confidence ratings. Do lower scorers show worse resolution, i.e. less difference between their confidence when right and when wrong?</p>${enough(d.list.length, 12)}
      ${legend([{ name:'Resolution (confidence right − wrong)', color:COL.accent }, { name:'Bias (confidence − accuracy)', color:COL.grey }])}
      ${q ? barChart({ groups:qlab, series:[{ name:'Resolution', color:COL.accent, vals }, { name:'Bias', color:COL.grey, vals:bias }], y0:-10, y1:40, yTicks:tick(-10, 40, 10), yLabel:'Points', vFmt:v => (v >= 0 ? '+' : '') + Math.round(v) }) : '<p class="muted">Needs at least four students.</p>'}
      ${tutor('This is the more nuanced framing from Lecture 2: low performers have less reliable signal to monitor. If the orange bars rise from left to right, there is some real difference in resolution, not just a statistical artefact. Trust policy rule 1: when can self-assessment be trusted, and what should replace it when it can\'t?')}`;
  }
  return t.html + body;
}
function stageAdvice(){
  const t = tabs('h2advr', [['a','a · How far did you move?'],['b','b · Should you have moved more?'],['c','c · Did confidence guide you?'],['d','d · One advisor or five?']]);
  const tr = anaAdvice(); let body = enough(tr.length, 40);
  if (t.cur === 'a'){
    const bins = [0, .2, .4, .6, .8, 1]; const lab = ['Ignored it (0)','0–20%','20–40%','40–60%','60–80%','80–100%','Adopted it (1)'];
    const counts = [tr.filter(x => x.woa === 0).length].concat([0,1,2,3,4].map(i => tr.filter(x => x.woa > bins[i] && x.woa <= bins[i + 1] && x.woa < 1).length)).concat([tr.filter(x => x.woa === 1).length]);
    body = `<div class="label">Part 2 · An advisor</div><h1>How far did you move towards the advice?</h1>
      <p class="prompt">For each question: 0% means you kept your own answer, 100% means you switched to the advice completely, 50% means you met in the middle.</p>${body}
      ${barChart({ groups:lab, series:[{ name:'Trials', color:COL.accent, vals:counts.map(c => tr.length ? 100 * c / tr.length : NaN) }], y0:0, y1:Math.max(40, Math.ceil(Math.max(...counts.map(c => tr.length ? 100 * c / tr.length : 0)) / 10) * 10), yTicks:tick(0, 60, 10), yFmt:v => v + '%', yLabel:'Share of answers', vFmt:v => Math.round(v) + '%', m:{ b:70 } })}
      ${keystats([{ n: pct0(mean(tr.map(x => x.woa))), l:'average move towards the advice' }, { n: pct0(tr.filter(x => x.woa === 0).length / tr.length), l:'of answers ignored the advice entirely' }, { n:'≈ 30%', l:'typical in published studies' }])}
      ${tutor('Egocentric discounting (Lecture 3): people weight their own opinion far more than an equally informed peer\'s. Ask: why might your own answer feel more trustworthy? (You know your reasons; you only see their number.)')}`;
  } else if (t.cur === 'b'){
    const v = [mean(tr.map(x => x.eInit)), mean(tr.map(x => x.eFinal)), mean(tr.map(x => x.eAvg)), mean(tr.map(x => x.eAdv))];
    body = `<div class="label">Part 2 · An advisor</div><h1>Should you have moved more?</h1>
      <p class="prompt">Average error (standardised across questions; lower is better).</p>${body}
      ${barChart({ groups:['Your first answer','Your final answer','Simple average of you + advice','The advice alone'], series:[{ name:'Error', color:COL.accent, vals:v }], y0:0, y1:Math.max(1, Math.ceil(Math.max(...v.filter(fin)) * 5) / 5 + .2), yTicks:tick(0, 2, .25), yFmt:v => v.toFixed(2), yLabel:'Average error (lower = better)', vFmt:v => v.toFixed(2) })}
      ${keystats([{ n: pct0(1 - v[1] / v[0]), l:'error reduction you actually achieved' }, { n: pct0(1 - v[2] / v[0]), l:'reduction if everyone had just averaged' }])}
      ${tutor('Averaging two independent estimates cancels out some of each person\'s error, so simply splitting the difference usually beats what people actually do. Trust policy rule 2: when should we defer, and how much?')}`;
  } else if (t.cur === 'c'){
    const g = [[1,2],[3],[4,5]].map(cs => tr.filter(x => cs.includes(x.conf)));
    body = `<div class="label">Part 2 · An advisor</div><h1>Did your confidence decide how much you listened?</h1>
      <p class="prompt">Movement towards advice, split by how confident you were in your first estimate. And was that the right call?</p>${body}
      ${legend([{ name:'Move towards advice', color:COL.accent }, { name:'Error of your first estimate', color:COL.grey }])}
      ${barChart({ groups:['Low confidence (1–2)','Medium (3)','High confidence (4–5)'], groupSub:g.map(x => 'n = ' + x.length), series:[{ name:'WOA', color:COL.accent, vals:g.map(x => mean(x.map(y => y.woa)) * 100) }, { name:'Error', color:COL.grey, vals:g.map(x => mean(x.map(y => y.eInit)) * 100) }], y0:0, y1:'AUTO', yTicks:'AUTO', yLabel:'%  /  error × 100', vFmt:v => Math.round(v), m:{ b:72 } })}
      ${tutor('Ideally, low confidence should mean both "I moved more" and "my first answer was worse". If the grey bars fall from left to right, confidence carried real information, and using it to decide how much to listen was sensible. Link back to hour 1: confidence is only useful when it tracks accuracy.')}`;
  } else {
    const one = tr.filter(x => x.type === 'one'), five = tr.filter(x => x.type === 'five');
    body = `<div class="label">Part 2 · An advisor</div><h1>One classmate, or the average of five?</h1>
      <p class="prompt">Half your questions showed one classmate's answer; half showed the average of five.</p>${body}
      ${legend([{ name:'Move towards advice', color:COL.accent }, { name:'Error of the advice', color:COL.grey }])}
      ${barChart({ groups:['One classmate','Average of five'], groupSub:['n = ' + one.length, 'n = ' + five.length], series:[{ name:'WOA', color:COL.accent, vals:[mean(one.map(x => x.woa)) * 100, mean(five.map(x => x.woa)) * 100] }, { name:'Error', color:COL.grey, vals:[mean(one.map(x => x.eAdv)) * 100, mean(five.map(x => x.eAdv)) * 100] }], y0:0, y1:'AUTO', yTicks:'AUTO', yLabel:'%  /  error × 100', vFmt:v => Math.round(v), m:{ b:72 } })}
      ${tutor('The average of five is usually much more accurate (wisdom of crowds) but people often barely weight it more than a single person. Trust policy: does your rule reward independent, aggregated advice?')}`;
  }
  return t.html + body;
}
function stageGroup(){
  const t = tabs('h2group', [['a','a · Combining confidence'],['b','b · Your actual teams']]);
  if (t.cur === 'b') return t.html + stageDebriefTeamsOnly();
  const d = anaGroup(), A = d.acc;
  const ser = [['Average individual','avg',COL.pale],['Majority vote','maj',COL.grey],['Confidence-weighted vote','cw',COL.accent],['Follow the most confident','mc',COL.light],['Best member (in hindsight)','best',COL.dark]];
  return t.html + `<div class="label">Part 3 · The group</div><h1>When should confidence decide?</h1>
    <p class="prompt">Using everyone's private round 2 answers, the app forms ${300} random groups of ${d.k} and combines their answers in different ways.</p>${enough(d.n, 10)}
    ${legend(ser.map(s => ({ name:s[0], color:s[2] })))}
    ${barChart({ groups:['Hard (non-deceptive) questions','Deceptive questions'], series: ser.map(s => ({ name:s[0], color:s[2], vals:[mean(A.normal[s[1]]) * 100, mean(A.deceptive[s[1]]) * 100] })), y0:0, y1:100, yTicks:tick(0, 100, 25), yFmt:v => v + '%', yLabel:'Group answer correct', vFmt:v => Math.round(v) + '%' })}
    ${keystats([{ n: pct0(mean(A.normal.cw)) + ' vs ' + pct0(mean(A.normal.maj)), l:'hard questions: confidence-weighted vs majority' }, { n: pct0(mean(A.deceptive.cw)) + ' vs ' + pct0(mean(A.deceptive.maj)), l:'deceptive questions: confidence-weighted vs majority' }])}
    ${tutor('Koriat (2012): confidence tracks how widely an answer is shared, not whether it is true. When most people are right, weighting by confidence helps; when most people share the same wrong intuition, confident members lead the group further astray. Trust policy rule 3: when should confidence decide, and what protects against a confident wrong consensus?')}`;
}
function stageDebriefTeamsOnly(){
  const prev = S.ui.tab.debrief; S.ui.tab.debrief = 'team'; const h = stageDebrief().replace(/<div class="tabs controls">[\s\S]*?<\/div>/, ''); S.ui.tab.debrief = prev; return h;
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  if (!S.code){ render(); return; }
  $('#tag').textContent = 'Session ' + S.code + (S.local ? ' · offline' : '');
  S.pid = S.host ? 'host' : getPid();
  try { S.db = S.local ? makeLocalDB(S.code) : await makeFirebaseDB(S.code); }
  catch(e){ showError(e); return; }
  let first = true;
  S.db.onSession(s => {
    S.session = s;
    if (S.host && !s && first){ S.db.setSession({ phase:'lobby', adv: params.get('adv') === '1', nTeams:5, created:Date.now() }).catch(showError); }
    first = false; render();
  }, showError);
  S.db.onResps(o => {
    S.resps = o || {};
    if (!S.host){ const mine = S.resps[S.pid]; if (mine) S.me = deepMerge(mine, S.me); }
    render();
  }, showError);
  S.db.onTeams(o => { S.teams = o || {}; render(); }, showError);
  // Fallback: live listeners can stall (Safari background tabs, some campus networks), so re-check every few seconds.
  const resync = async () => {
    try {
      const s = await S.db.getSession();
      if (s && JSON.stringify(s) !== JSON.stringify(S.session)){ S.session = s; render(); }
      if (curPhase() === 'r4'){ const t = await S.db.getTeams(); if (JSON.stringify(t) !== JSON.stringify(S.teams)){ S.teams = t; render(); } }
    } catch(e){}
  };
  if (!S.host){ setInterval(() => { if (!document.hidden) resync(); }, 5000); setTimeout(() => render(), 8500); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resync(); });
  window.addEventListener('focus', resync);
  if (S.host) document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'p' || e.key === 'P') document.body.classList.toggle('present');
    if (/^[1-9]$/.test(e.key)){ const t = document.querySelectorAll('[data-tab]')[Number(e.key) - 1]; if (t) t.click(); }
    const vis = visiblePhases(), ci = vis.findIndex(p => p.id === curPhase());
    if (e.key === 'ArrowRight' && ci < vis.length - 1) S.db.setSession({ phase:vis[ci + 1].id });
    if (e.key === 'ArrowLeft' && ci > 0) S.db.setSession({ phase:vis[ci - 1].id });
  });
}
boot();
</script>
