<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../gate.js"></script>
<title>Advice-giver paradigm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg:        #fcf6ef;
  --color-bg-warm:   #f6f0e9;
  --color-bg-card:   #f0e8dd;
  --color-bg-dark:   #2b180a;
  --color-text:      #2b180a;
  --color-text-muted:#6b5a4a;
  --color-text-light:#9a8a7a;
  --color-accent:    #c8956c;
  --color-accent-h:  #b07a52;
  --color-border:    #e0d4c6;
  --font-display:    'Playfair Display', Georgia, serif;
  --font-body:       'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --ease:            cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--color-bg); }
body { font-family: var(--font-body); color: var(--color-text); -webkit-font-smoothing: antialiased; overflow: hidden; }

.wrap { position: absolute; inset: 0; min-height: 300px; overflow: hidden; background: var(--color-bg); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* top-left: title and controls */
.top-left { position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 3; }
.title { font-family: var(--font-display); font-size: 19px; font-weight: 500; letter-spacing: .005em; }
.ctrl { display: flex; gap: 6px; align-items: center; }
.ib, .speed {
  height: 34px; min-width: 34px; border-radius: 999px; border: 1px solid var(--color-border);
  background: rgba(252, 246, 239, .92); color: var(--color-text); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font: 500 12px var(--font-body); transition: background .25s var(--ease), border-color .25s var(--ease);
}
.ib:hover, .speed:hover { background: var(--color-bg-card); border-color: var(--color-accent); }
.ib:focus-visible, .speed:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.speed { padding: 0 12px; }
.ib svg { width: 14px; height: 14px; fill: currentColor; }

/* room labels */
.label {
  position: absolute; transform: translate(-50%, -100%); z-index: 2; pointer-events: none;
  background: rgba(252, 246, 239, .92); border: 1px solid var(--color-border); border-radius: 999px;
  padding: 5px 12px; font-size: 12px; font-weight: 500; color: var(--color-text-muted); white-space: nowrap;
  transition: opacity .5s var(--ease), color .5s var(--ease);
}
.label b { color: var(--color-text); font-weight: 600; }
.label .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* small clock shown while the trials repeat */
.ffclock { position: absolute; top: 12px; right: 14px; z-index: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; opacity: 0; pointer-events: none; }
.ffclock svg { width: 64px; height: 64px; display: block; filter: drop-shadow(0 4px 10px rgba(43, 24, 10, .12)); }
.ffclock span { font: 500 11.5px var(--font-body); color: var(--color-text-muted); background: rgba(252, 246, 239, .92); border: 1px solid var(--color-border); border-radius: 999px; padding: 3px 10px; }

/* caption */
.caption {
  position: absolute; left: 16px; bottom: 16px; z-index: 3; width: min(450px, calc(100% - 32px));
  background: rgba(252, 246, 239, .95); border: 1px solid var(--color-border); border-radius: 14px;
  padding: 14px 18px 16px; box-shadow: 0 10px 34px rgba(43, 24, 10, .08);
}
.caption .tag { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--color-accent-h); margin-bottom: 4px; }
.caption h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1.2; margin-bottom: 6px; }
.caption p { font-size: 13.5px; line-height: 1.55; color: var(--color-text-muted); }
.caption .in { animation: up .5s var(--ease); }
@keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.fail { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--color-text-muted); font-size: 14px; }

@media (max-width: 620px) {
  .ffclock svg { width: 60px; height: 60px; }
  .title { display: none; }
  .caption { left: 10px; bottom: 10px; width: calc(100% - 20px); padding: 11px 14px 13px; }
  .caption h2 { font-size: 18px; }
  .caption p { font-size: 12.5px; }
  .top-left { left: 10px; top: 10px; }
  .label { font-size: 11px; padding: 4px 9px; }
}
@media (prefers-reduced-motion: reduce) { .caption .in { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="gl" aria-label="Animation of the advice-giver paradigm" role="img"></canvas>

  <div class="top-left">
    <div class="title">Advice-giver paradigm</div>
    <div class="ctrl">
      <button class="ib" id="bRestart" aria-label="Restart" title="Restart"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 0 5.2 7.3h-1.7A3.9 3.9 0 1 1 8 4.1c1 0 1.8.4 2.5 1L8.8 6.8H14V1.6l-2 2A5.5 5.5 0 0 0 8 2.5z"/></svg></button>
      <button class="ib" id="bPlay" aria-label="Pause" title="Pause (space)"></button>
      <button class="speed" id="bSpeed" aria-label="Playback speed" title="Playback speed">1x</button>
    </div>
  </div>

  <div class="label" id="lblL"><span class="dot" style="background:#c8956c"></span><b>You</b> &middot; regulator</div>
  <div class="label" id="lblR"><span class="dot" style="background:#2b180a"></span><b>Partner</b> &middot; target</div>

  <div class="ffclock" id="ffClock" aria-hidden="true">
    <svg viewBox="-50 -50 100 100">
      <circle r="46" fill="#fcf6ef" stroke="#c8956c" stroke-width="4"/>
      <g id="ffTicks"></g>
      <line id="ffHour" x1="0" y1="0" x2="0" y2="-22" stroke="#2b180a" stroke-width="4.5" stroke-linecap="round"/>
      <line id="ffMin" x1="0" y1="0" x2="0" y2="-34" stroke="#b07a52" stroke-width="3" stroke-linecap="round"/>
      <circle r="4" fill="#2b180a"/>
    </svg>
    <span>and so on for every image</span>
  </div>

  <div class="caption" aria-live="polite">
    <div class="tag" id="cTag"></div>
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
  </div>

  <div class="fail" id="fail">The 3D library could not be loaded. Check your connection and reload.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
if (typeof THREE === 'undefined') { document.getElementById('fail').style.display = 'grid'; return; }

/* ---------- palette (matches usyd-meta-lab.github.io) ---------- */
const C = {
  text: '#2b180a', bg: '#fcf6ef', warm: '#f6f0e9', card: '#f0e8dd', dark: '#2b180a', muted: '#6b5a4a', light: '#9a8a7a',
  accent: '#c8956c', accentH: '#b07a52', border: '#e0d4c6', red: '#b03a2e', green: '#2e9e4f'
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const backOut = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (t, a, b) => { const u = prog(t, a, b); return u * u * (3 - 2 * u); };

/* ---------- timeline ---------- */
let cur = 0;
const mk = (id, d, props) => { const s = Object.assign({ id, a: cur, b: cur + d }, props); cur += d; return s; };
const SEGS = [
  mk('cover', 9, { g: 0 }),               // 0
  mk('match', 5, { g: 0 }),               // 1
  mk('advice', 10, { g: 1, trial: 1 }),   // 2
  mk('wait', 7, { g: 1, trial: 1 }),      // 3
  mk('fb', 4, { g: 1, trial: 1 }),        // 4
  mk('obs', 4.5, { g: 1, trial: 2 }),     // 5
  mk('wait', 5, { g: 1, trial: 2 }),      // 6
  mk('fb', 3, { g: 1, trial: 2 }),        // 7
  mk('ff', 4, { g: 1 }),                  // 8
  mk('eff', 7, { g: 2 }),                 // 9
  mk('probe', 9, { g: 3 }),               // 10
  mk('debrief', 3.2, { g: 4 }),           // 11
  mk('reveal', 6.6, { g: 4 })             // 12
];
const END = cur;
const segAt = t => { for (let i = 0; i < SEGS.length; i++) if (t < SEGS[i].b) return SEGS[i]; return SEGS[SEGS.length - 1]; };

const T1 = { kind: 'help', n: 1, score: 6, A: SEGS[2].a, W: SEGS[3].a, F: SEGS[4].a };
Object.assign(T1, { typeA: T1.A + 1.2, typeB: T1.A + 6.2, subm: T1.A + 6.9, send: T1.A + 7.2, arrive: T1.A + 9.0,
  imgOn: T1.W + 0.9, imgOff: T1.F, rateA: T1.F + 0.15, rateB: T1.F + 1.1, sub: T1.F + 1.25, send2: T1.F + 1.35, arrive2: T1.F + 2.6 });
const T2 = { kind: 'observe', n: 2, score: 4, O: SEGS[5].a, W: SEGS[6].a, F: SEGS[7].a };
Object.assign(T2, { imgOn: T2.W + 0.5, imgOff: T2.F, rateA: T2.F + 0.1, rateB: T2.F + 0.8, sub: T2.F + 0.9, send2: T2.F + 0.95, arrive2: T2.F + 2.0 });
const TRI = { 1: T1, 2: T2 };
const FF = SEGS[8], EFF = SEGS[9], PRB = SEGS[10], DEB = SEGS[11], REV = SEGS[12];
const D0 = REV.a + 0.5;           // dissolve begins
const ADVICE_TEXT = 'Try to remember it is only a picture, and the feeling will pass quickly.';

/* ---------- captions ---------- */
const CAP = {
  cover:   ['Cover story', 'Participants are told the study is about how people help each other deal with negative emotions. One person is the regulator (the advice giver) and the other is the target, who views negative images. They sit in separate rooms and can only send short text messages.'],
  match:   ['Matching', 'A "Matching you with a partner" screen turns into "Matched!". From here on the participant believes a real person is on the other side of the wall.'],
  advice:  ['Advice', 'On Help trials the regulator has 40 seconds to type advice for their partner, who is about to see a negative image. The message is sent across to the partner.'],
  obs:     ['Observation', 'On Observe trials advice is locked. The regulator can only watch what happens after their partner sees the image.'],
  wait:    ['Waiting for the partner', 'The partner views the image for a random 4 to 10 seconds while the regulator waits.'],
  fb:      ['Feedback', 'The partner rates how they feel on a 10-point scale, and the regulator sees that rating after each image.'],
  ff:      ['The cycle repeats', 'Advice (or observation), waiting and feedback repeat across the whole set of images.'],
  eff:     ['Efficacy rating', 'The regulator rates how effective their advice was, from "I made them feel a lot worse" to "I made them feel a lot better".'],
  probe:   ['Suspicion probes', 'Open questions check what participants thought the study was about, and whether anything seemed odd.'],
  debrief: ['Debrief', 'Participants are told how the study really worked.'],
  reveal:  ['There was no other person', 'The partner, their room and the feedback were never real. The feedback was generated by the experimenter.']
};
function tagFor(s) {
  if (s.trial) return 'Trial ' + s.trial + ' of 30 · ' + (TRI[s.trial].kind === 'help' ? 'Help trial' : 'Observe trial');
  switch (s.id) {
    case 'cover': case 'match': return 'Setup';
    case 'ff': return 'Trials 3 to 30';
    case 'eff': case 'probe': return 'After the trials';
    default: return 'Debrief';
  }
}

/* ---------- renderer / scene ---------- */
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 16 / 9, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.76));
const sun = new THREE.DirectionalLight(0xffffff, 0.34);
sun.position.set(-5, 10, 9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 9, bottom: -5, near: 1, far: 34 });
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.04;
scene.add(sun);
const redLight = new THREE.PointLight(0xb03a2e, 0, 4.6, 1.6);
redLight.position.set(3.0, 2.0, 0.6);
scene.add(redLight);

const mat = (col, fade) => new THREE.MeshLambertMaterial({ color: col });
const box = (w, h, d, col) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(col)); m.castShadow = true; m.receiveShadow = true; return m; };
const cyl = (rt, rb, h, col, seg = 20) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(col)); m.castShadow = true; m.receiveShadow = true; return m; };
const ball = (r, col) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 16), mat(col)); m.castShadow = true; return m; };
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };

/* ground shadow catcher */
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.ShadowMaterial({ opacity: 0.1 }));
  g.rotation.x = -Math.PI / 2; g.position.y = -0.21; g.receiveShadow = true; scene.add(g);
}

/* rooms */
const ROOM_W = 6.4, ROOM_D = 4.4, ROOM_H = 3.2;
[-1, 1].forEach(s => {
  const cx = s * 3.4;
  scene.add(at(box(ROOM_W, 0.2, ROOM_D, '#f0e8dd'), cx, -0.1, 0));
  scene.add(at(box(ROOM_W, 0.2, 0.05, s < 0 ? '#c8956c' : '#6b5a4a'), cx, -0.1, ROOM_D / 2 + 0.02));
  scene.add(at(box(ROOM_W, ROOM_H, 0.15, '#f6f0e9'), cx, ROOM_H / 2, -ROOM_D / 2 + 0.075));
  scene.add(at(box(ROOM_W, 0.16, 0.18, '#e0d4c6'), cx, 0.08, -ROOM_D / 2 + 0.16));        // skirting
  // window
  const wx = s * 5.5;
  scene.add(at(box(1.3, 1.3, 0.06, '#d9c6ad'), wx, 2.0, -ROOM_D / 2 + 0.17));
  scene.add(at(box(1.12, 1.12, 0.05, '#fffaf2'), wx, 2.0, -ROOM_D / 2 + 0.2));
  scene.add(at(box(0.03, 1.12, 0.06, '#d9c6ad'), wx, 2.0, -ROOM_D / 2 + 0.22));
  scene.add(at(box(1.12, 0.03, 0.06, '#d9c6ad'), wx, 2.0, -ROOM_D / 2 + 0.22));
  // desk
  scene.add(at(box(3.25, 0.08, 1.4, '#d9c6ad'), s * 2.925, 0.92, -1.4));
  scene.add(at(box(3.2, 0.7, 0.04, '#c9b49b'), s * 2.925, 0.55, -2.05));
  scene.add(at(box(0.08, 0.9, 1.3, '#c9b49b'), s * 1.38, 0.45, -1.4));
});
/* the wall between the rooms */
scene.add(at(box(0.4, 3.4, ROOM_D, '#cdb9a2'), 0, 1.7, 0));
scene.add(at(box(0.42, 0.05, ROOM_D + 0.02, '#b39d85'), 0, 3.42, 0));

/* ---------- canvas screens ---------- */
const W = 800, H = 500;
const SANS = 'Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif';
const SERIF = '"Playfair Display", Georgia, serif';
const F = (w, s, fam = SANS) => w + ' ' + s + 'px ' + fam;
function makeScreen() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter; tex.anisotropy = 8;
  return { c, ctx: c.getContext('2d'), tex };
}
const scrL = makeScreen(), scrR = makeScreen();

const fadeItems = [];   // meshes that dissolve at the reveal
function trackFade(group) {
  group.updateMatrixWorld(true);
  const p = new THREE.Vector3();
  group.traverse(o => {
    if (o.isMesh) { o.material.transparent = true; o.getWorldPosition(p); fadeItems.push({ mesh: o, y: p.y }); }
  });
}

function makeMonitor(side, screen) {
  const g = new THREE.Group();
  g.position.set(side * 2.9, 0.96, -1.3);
  g.rotation.y = side * 0.4;
  g.add(at(box(2.56, 1.66, 0.09, '#2b180a'), 0, 1.09, 0));
  g.add(at(box(0.12, 0.28, 0.1, '#2b180a'), 0, 0.14, -0.02));
  g.add(at(box(0.62, 0.04, 0.36, '#2b180a'), 0, 0.02, 0));
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.5), new THREE.MeshBasicMaterial({ map: screen.tex }));
  scr.position.set(0, 1.09, 0.047);
  g.add(scr);
  return g;
}
const monL = makeMonitor(-1, scrL), monR = makeMonitor(1, scrR);
scene.add(monL, monR);

/* keyboards */
const kbL = at(box(0.9, 0.04, 0.28, '#e8dcc9'), -4.0, 0.98, -1.0);
const kbR = at(box(0.9, 0.04, 0.28, '#e8dcc9'), 4.0, 0.98, -1.0);
scene.add(kbL, kbR);

/* people */
function buildPerson(side, shirt, hair, skin) {
  const root = new THREE.Group();
  root.position.set(side * 4.9, 0, -1.0);
  root.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;
  const trousers = '#6b5a4a';
  [-0.13, 0.13].forEach(sx => {
    root.add(at(box(0.2, 0.2, 0.62, trousers), sx, 0.66, 0.28));
    root.add(at(box(0.18, 0.6, 0.18, trousers), sx, 0.3, 0.58));
    root.add(at(box(0.2, 0.08, 0.32, '#2b180a'), sx, 0.04, 0.66));
  });
  root.add(at(box(0.5, 0.2, 0.34, trousers), 0, 0.66, 0));
  const torso = new THREE.Group(); torso.position.set(0, 0.74, 0); root.add(torso);
  torso.add(at(cyl(0.23, 0.27, 0.7, shirt), 0, 0.35, 0));
  const head = new THREE.Group(); head.position.set(0, 0.78, 0); torso.add(head);
  head.add(at(cyl(0.07, 0.08, 0.12, skin), 0, 0.0, 0));
  head.add(at(ball(0.2, skin), 0, 0.2, 0));
  const hairM = new THREE.Mesh(new THREE.SphereGeometry(0.226, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), mat(hair));
  hairM.position.set(0, 0.215, -0.03); hairM.rotation.x = -0.45; hairM.castShadow = false; head.add(hairM);
  [-0.075, 0.075].forEach(ex => head.add(at(ball(0.026, '#2b180a'), ex, 0.22, 0.185)));
  const shoulders = [], elbows = [];
  [-1, 1].forEach(sx => {
    const sh = new THREE.Group(); sh.position.set(sx * 0.3, 0.62, 0); sh.rotation.x = -0.9; torso.add(sh);
    sh.add(ball(0.1, shirt));
    sh.add(at(cyl(0.07, 0.065, 0.4, shirt), 0, -0.2, 0));
    const el = new THREE.Group(); el.position.set(0, -0.4, 0); el.rotation.x = -0.55; sh.add(el);
    el.add(at(cyl(0.06, 0.055, 0.36, shirt), 0, -0.18, 0));
    el.add(at(ball(0.065, skin), 0, -0.38, 0));
    shoulders.push(sh); elbows.push(el);
  });
  return { root, torso, head, shoulders, elbows };
}
function buildChair(side) {
  const g = new THREE.Group();
  g.position.set(side * 4.9, 0, -1.0);
  g.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;
  g.add(at(box(0.64, 0.08, 0.64, '#9a8a7a'), 0, 0.5, -0.02));
  g.add(at(box(0.64, 0.62, 0.07, '#9a8a7a'), 0, 0.86, -0.34));
  g.add(at(cyl(0.04, 0.04, 0.46, '#6b5a4a', 10), 0, 0.25, -0.02));
  g.add(at(cyl(0.34, 0.34, 0.05, '#6b5a4a', 24), 0, 0.03, -0.02));
  return g;
}
const pL = buildPerson(-1, '#c8956c', '#2b180a', '#e7c7a6');
const pR = buildPerson(1, '#2b180a', '#6b5a4a', '#cfa07c');
scene.add(pL.root, pR.root, buildChair(-1), buildChair(1));

/* everything on the partner's side that dissolves in the reveal (the chair stays) */
[pR.root, monR, kbR].forEach(trackFade);
// the partner's desk pieces are the last three scene children of each desk set; register by position
scene.children.forEach(o => {
  if (o.isMesh && o.position.x > 1.2 && o.position.x < 4.9 && o.position.z < -0.9 && o.position.y > 0.4 && o.position.y < 1.0) trackFade(o);
});

/* channel arc between the two monitors */
const PL = new THREE.Vector3(-2.9, 2.95, -1.3), PR = new THREE.Vector3(2.9, 2.95, -1.3), PC = new THREE.Vector3(0, 5.2, -0.7);
function bez(u, out, rev) {
  const a = rev ? PR : PL, b = rev ? PL : PR, m = 1 - u;
  return out.set(m * m * a.x + 2 * m * u * PC.x + u * u * b.x, m * m * a.y + 2 * m * u * PC.y + u * u * b.y, m * m * a.z + 2 * m * u * PC.z + u * u * b.z);
}
const LN = 60;
const lineGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array((LN + 1) * 3), v = new THREE.Vector3();
  for (let i = 0; i <= LN; i++) { bez(i / LN, v, false); pos.set([v.x, v.y, v.z], i * 3); }

function leftEff(ctx, t) {
  const a = EFF.a;
  text(ctx, 'How effective was your advice?', 400, 96, F(600, 30), C.text);
  para(ctx, 'Rate how effective you think you were at making your partner feel better, compared to doing nothing.', 400, 140, 620, 28, F(400, 20), C.muted);
  const x0 = 130, x1 = 670, xm = 400, y = 290;
  const v = 45 * backOut(prog(t, a + 1.2, a + 3.2));
  const tx = lerp(x0, x1, (v + 100) / 200);
  ctx.fillStyle = C.border; rr(ctx, x0, y - 5, x1 - x0, 10, 5); ctx.fill();
  ctx.fillStyle = v >= 0 ? C.green : C.red; ctx.globalAlpha = 0.6 * clamp(Math.abs(v) / 25);
  ctx.fillRect(Math.min(xm, tx), y - 5, Math.abs(tx - xm), 10); ctx.globalAlpha = 1;
  ctx.fillStyle = C.muted; ctx.fillRect(xm - 1.5, y - 14, 3, 28);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.dark; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(tx, y, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const vv = Math.round(v);
  ctx.save(); ctx.globalAlpha = prog(t, a + 1.0, a + 1.5);
  text(ctx, (vv > 0 ? '+' : '') + vv, tx, y - 30, F(600, 24), v > 3 ? C.green : v < -3 ? C.red : C.muted);
  ctx.restore();
  para(ctx, 'I made them feel a lot worse', 170, 342, 190, 22, F(400, 16), C.muted);
  para(ctx, 'I had no effect on how they felt', 400, 342, 190, 22, F(400, 16), C.muted);
  para(ctx, 'I made them feel a lot better', 630, 342, 190, 22, F(400, 16), C.muted);
  button(ctx, 'Continue', 400, 440, 160, t > a + 5.6 && t < a + 5.95);
}
function leftProbe(ctx, t) {
  const p = PRB.a, q2 = t >= p + 4.6;
  const al = q2 ? prog(t, p + 4.6, p + 4.9) : Math.min(prog(t, p, p + 0.3), 1 - prog(t, p + 4.3, p + 4.6));
  ctx.save(); ctx.globalAlpha = clamp(al);
  if (!q2) {
    text(ctx, 'Question 1 of 2', 400, 90, F(500, 16), C.light);
    para(ctx, 'What did you think this study was about?', 400, 140, 620, 36, F(600, 30), C.text);
    textbox(ctx, 100, 196, 600, 120, typed('How people help each other feel better.', t, p + 0.7, p + 3.2), t, t < p + 4, false);
    button(ctx, 'Next', 400, 380, 130, t > p + 3.9 && t < p + 4.2);
  } else {
    text(ctx, 'Question 2 of 2', 400, 90, F(500, 16), C.light);
    para(ctx, 'Did you notice anything odd in this study? If so, please describe it below.', 400, 138, 640, 34, F(600, 28), C.text);
    textbox(ctx, 100, 214, 600, 120, typed('Nothing in particular.', t, p + 5.2, p + 7.0), t, t < p + 8.3, false);
    button(ctx, 'Next', 400, 396, 130, t > p + 8.2 && t < p + 8.5);
  }
  ctx.restore();
}
function leftDebrief(ctx, t) {
  const d = DEB.a;
  text(ctx, 'Debrief', 400, 110, F(500, 46, SERIF), C.text);
  ctx.save(); ctx.globalAlpha = smooth(t, d + 0.2, d + 0.7);
  para(ctx, 'Thank you for taking part. You were told you were paired with another person who was viewing negative images.', 400, 170, 640, 32, F(400, 22), C.muted);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = smooth(t, d + 1.4, d + 2.0);
  para(ctx, 'In fact, there was no other person. The feedback you saw was generated by the experimenter.', 400, 300, 640, 36, F(600, 26), C.accentH);
  ctx.restore();
}
function ratingRow(ctx, sel, t, y) {
  for (let i = 0; i < 10; i++) {
    const x = 400 + (i - 4.5) * 68, d = Math.abs(i + 1 - sel), sc = 1 + 0.28 * clamp(1 - d);
    drawFace(ctx, x, y, 27 * sc, i + 1);
    text(ctx, String(i + 1), x, y + 56, F(500, 15), C.light);
  }
  const sx = 400 + (sel - 1 - 4.5) * 68;
  ctx.strokeStyle = C.accent; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(sx, y, 27 * 1.28 + 8, 0, Math.PI * 2); ctx.stroke();
}
function rightPre(ctx, t, s) {
  const tr = TRI[s.trial];
  if (tr.kind === 'help') {
    if (t < tr.arrive) {
      text(ctx, 'Your partner is writing advice for you...', 400, 210, F(400, 26), C.muted);
      dots(ctx, 400, 270, t);
    } else {
      const k = backOut(prog(t, tr.arrive, tr.arrive + 0.4));
      ctx.save(); ctx.translate(400, 230); ctx.scale(k, k); ctx.translate(-400, -230);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = C.accent; ctx.lineWidth = 3; rr(ctx, 100, 130, 600, 200, 16); ctx.fill(); ctx.stroke();
      text(ctx, 'Advice from your partner', 130, 178, F(600, 18), C.accentH, 'left');
      para(ctx, ADVICE_TEXT, 130, 224, 540, 34, F(400, 26), C.text, 'left');
      ctx.restore();
    }
  } else {
    text(ctx, 'Get ready for the next image...', 400, 230, F(400, 28), C.muted);
    dots(ctx, 400, 290, t);
  }
}
function rightWait(ctx, t, s) {
  const tr = TRI[s.trial];
  if (t < tr.imgOn) { rightPre(ctx, t, s); return; }
  negImage(ctx, 0, 42, W, H - 42, 10 + s.trial, t);
  ctx.save(); ctx.globalAlpha = 1 - smooth(t, tr.imgOn, tr.imgOn + 0.35);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 42, W, H - 42);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = 'rgba(43,24,10,.7)'; rr(ctx, 230, 446, 340, 32, 16); ctx.fill();
  ctx.globalAlpha = 1; text(ctx, 'Placeholder, not a real stimulus', 400, 467, F(500, 15), '#f0e8dd');
  ctx.restore();
}
function rightRate(ctx, t, s) {
  const tr = TRI[s.trial];
  if (t >= tr.sub + 0.3) {
    text(ctx, 'Thank you. Waiting for the next trial...', 400, 230, F(400, 26), C.muted);
    dots(ctx, 400, 290, t);
    return;
  }
  text(ctx, 'How are you feeling now?', 400, 100, F(600, 30), C.text);
  const sel = lerp(5, tr.score, ease(prog(t, tr.rateA, tr.rateB)));
  ratingRow(ctx, sel, t, 220);
  text(ctx, 'Feeling worse', 94, 336, F(400, 17), C.light, 'center');
  text(ctx, 'Feeling better', 706, 336, F(400, 17), C.light, 'center');
  button(ctx, 'Submit', 400, 410, 150, t >= tr.sub && t < tr.sub + 0.3);
}
function rightFF(ctx, t) {
  const k = Math.floor((t - FF.a) * 5);
  if (k % 3 === 0) negImage(ctx, 0, 42, W, H - 42, k, t);
  else if (k % 3 === 1) { text(ctx, 'How are you feeling now?', 400, 100, F(600, 30), C.text); ratingRow(ctx, 1 + (k * 7) % 10, t, 220); }
  else { text(ctx, 'Get ready for the next image...', 400, 240, F(400, 28), C.muted); dots(ctx, 400, 300, t); }
}
function rightIdle(ctx, t) {
  spinner(ctx, 400, 200, 42, t, C.light, 5);
  text(ctx, 'Please wait...', 400, 306, F(400, 26), C.muted);
}

function drawLeft(ctx, t) {
  base(ctx, 'REGULATOR (YOU)', C.accent);
  const s = segAt(t), id = s.id;
  if (id === 'cover') coverPage(ctx, t, 'L');
  else if (id === 'match') matchScreen(ctx, t);
  else if (id === 'advice') leftAdvice(ctx, t);
  else if (id === 'obs') leftObserve(ctx, t);
  else if (id === 'wait' || id === 'fb') leftWaitFb(ctx, t, s);
  else if (id === 'ff') leftFF(ctx, t);
  else if (id === 'eff') leftEff(ctx, t);
  else if (id === 'probe') leftProbe(ctx, t);
  else leftDebrief(ctx, t);
}
function drawRight(ctx, t) {
  base(ctx, 'TARGET (PARTNER)', C.dark);
  const s = segAt(t), id = s.id;
  if (id === 'cover') coverPage(ctx, t, 'R');
  else if (id === 'match') matchScreen(ctx, t);
  else if (id === 'advice' || id === 'obs') rightPre(ctx, t, s);
  else if (id === 'wait') rightWait(ctx, t, s);
  else if (id === 'fb') rightRate(ctx, t, s);
  else if (id === 'ff') rightFF(ctx, t);
  else rightIdle(ctx, t);
}

/* ---------- people animation ---------- */
function imageIntensity(t) {
  let d = 0;
  [T1, T2].forEach(tr => {
    const on = smooth(t, tr.imgOn, tr.imgOn + 0.6), off = 1 - smooth(t, tr.imgOff + 0.2, tr.imgOff + 1.6);
    d = Math.max(d, on * off);
  });
  if (t >= FF.a && t < FF.b) d = Math.max(d, 0.55 + 0.25 * Math.sin((t - FF.a) * 9)) * smooth(t, FF.a, FF.a + 0.3) * (1 - smooth(t, FF.b - 0.4, FF.b));
  return d;
}
const typingWindows = [[T1.typeA, T1.typeB], [PRB.a + 0.7, PRB.a + 3.2], [PRB.a + 5.2, PRB.a + 7.0]];
function animatePeople(t, amb) {
  const typing = typingWindows.some(w => t >= w[0] && t < w[1]);
  const waiting = (t >= T1.subm && t < T1.arrive2) || (t >= T2.W && t < T2.arrive2) || (t >= FF.a && t < FF.b);
  const nod = (t >= T1.arrive2 && t < T1.arrive2 + 1.2) || (t >= T2.arrive2 && t < T2.arrive2 + 1.0) ? Math.sin((t - (t < 40 ? T1.arrive2 : T2.arrive2)) * 7) * 0.06 : 0;
  const breathe = Math.sin(amb * 1.7) * 0.012;
  // regulator
  pL.torso.scale.y = 1 + breathe;
  pL.torso.rotation.x = 0.04 + (waiting ? 0.08 : 0) + nod * 0.6;
  pL.head.rotation.x = 0.03 + (typing ? 0.12 : 0) + nod;
  pL.head.rotation.z = waiting ? Math.sin(amb * 0.8) * 0.04 : 0;
  pL.elbows.forEach((e, i) => { e.rotation.x = -0.55 + (typing ? 0.09 * Math.sin(amb * 14 + i * 1.9) : 0); });
  // target
  const d = imageIntensity(t);
  pR.torso.scale.y = 1 + breathe * 1.4 + d * 0.01 * Math.sin(amb * 9);
  pR.torso.rotation.x = 0.03 - 0.16 * d;
  pR.head.rotation.x = 0.04 + 0.32 * d;
  pR.head.rotation.z = d * 0.03 * Math.sin(amb * 26);
  pR.shoulders.forEach(s => { s.rotation.x = -0.9 + 0.3 * d; });
  pR.elbows.forEach(e => { e.rotation.x = -0.55 + 0.25 * d; });
  return d;
}

/* ---------- camera ---------- */
const SHOT = {
  wide:       { p: [0, 5.3, 15.6], l: [0, 1.15, 0] },
  wall:       { p: [0, 4.8, 13.4], l: [0, 1.7, 0] },
  leftClose:  { p: [-4.3, 2.4, 3.9], l: [-2.9, 2.05, -1.3] },
  rightClose: { p: [4.3, 2.4, 3.9], l: [2.9, 2.05, -1.3] },
  rightRoom:  { p: [3.4, 3.3, 10.2], l: [3.5, 1.2, 0] }
};
const CAM = [
  [0, 'wide'],
  [T1.A, 'leftClose'], [T1.send - 0.1, 'wide'], [T1.arrive - 0.4, 'rightClose'], [T1.imgOn + 3.2, 'wide'],
  [T1.rateA - 0.05, 'rightClose'], [T1.send2 - 0.05, 'wide'], [T1.arrive2 - 0.35, 'leftClose'],
  [T2.O, 'wall'], [T2.W, 'wide'], [T2.rateA - 0.05, 'rightClose'], [T2.send2 - 0.05, 'wide'], [T2.arrive2 - 0.35, 'leftClose'],
  [FF.a, 'wide'], [EFF.a, 'leftClose'], [PRB.a, 'leftClose'], [DEB.a, 'leftClose'],
  [REV.a, 'rightRoom'], [REV.a + 4.4, 'wide']
];
function shotAt(t) { let s = CAM[0][1]; for (let i = 0; i < CAM.length; i++) if (t >= CAM[i][0]) s = CAM[i][1]; return s; }
const camPos = new THREE.Vector3(0, 5.3, 15.6), camLook = new THREE.Vector3(0, 1.15, 0);
let camDist = 20;
function applyCamera(t, dt, snap) {
  const sh = SHOT[shotAt(t)];
  const f = Math.max(1, (16 / 9) / camera.aspect);
  const l = new THREE.Vector3(...sh.l), p = new THREE.Vector3(...sh.p);
  p.sub(l).multiplyScalar(f).add(l);
  const k = snap ? 1 : 1 - Math.exp(-dt * 2.4);
  camPos.lerp(p, k); camLook.lerp(l, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  camDist = camPos.distanceTo(camLook);
}

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
const lblL = $('lblL'), lblR = $('lblR'), cTag = $('cTag'), cTitle = $('cTitle'), cText = $('cText');
const v3 = new THREE.Vector3();
function placeLabel(el, x, y, z, show) {
  v3.set(x, y, z).project(camera);
  el.style.left = ((v3.x * .5 + .5) * wrap.clientWidth) + 'px';
  el.style.top = ((-v3.y * .5 + .5) * wrap.clientHeight) + 'px';
  el.style.opacity = show ? 1 : 0;
}
// small clock shown while the trials repeat
const ffClock = $('ffClock'), ffHour = $('ffHour'), ffMin = $('ffMin');
{
  const g = $('ffTicks');
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 38 * Math.sin(a)); l.setAttribute('y1', -38 * Math.cos(a));
    l.setAttribute('x2', 42 * Math.sin(a)); l.setAttribute('y2', -42 * Math.cos(a));
    l.setAttribute('stroke', '#9a8a7a'); l.setAttribute('stroke-width', 2); g.appendChild(l);
  }
}

/* ---------- state / loop ---------- */
let t = 0, playing = true, speed = 1, holdEnd = 0, onScreen = true, drawnT = -1, forceDraw = true, last = performance.now(), amb = 0;
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) playing = false;
let capKey = '', gIdx = -1;

function setCaption(s) {
  const key = s.id + (s.trial || '');
  if (key === capKey) return;
  capKey = key;
  const c = CAP[s.id];
  cTag.textContent = tagFor(s); cTitle.textContent = c[0]; cText.textContent = c[1];
  [cTag, cTitle, cText].forEach(e => { e.classList.remove('in'); void e.offsetWidth; e.classList.add('in'); });
}
function updateHud(s) {
  setCaption(s);
  const on = smooth(t, FF.a, FF.a + 0.45) * (1 - smooth(t, FF.b - 0.5, FF.b));
  ffClock.style.opacity = on;
  const u = prog(t, FF.a, FF.b);
  ffMin.setAttribute('transform', 'rotate(' + (u * u * 1500 + u * 300) + ')');
  ffHour.setAttribute('transform', 'rotate(' + ((u * u * 1500 + u * 300) / 12) + ')');
  const wide = camDist > 12.5;
  placeLabel(lblL, -3.4, 3.65, -1.0, wide);
  const gone = t > D0 + 2.4;
  if (gone && !lblR.dataset.gone) { lblR.dataset.gone = 1; lblR.innerHTML = '<span class="dot" style="background:#e0d4c6"></span><b>No partner</b>'; }
  if (!gone && lblR.dataset.gone) { delete lblR.dataset.gone; lblR.innerHTML = '<span class="dot" style="background:#2b180a"></span><b>Partner</b> &middot; target'; }
  placeLabel(lblR, 3.4, 3.65, -1.0, wide);
}

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; amb = now / 1000;
  if (playing && onScreen) {
    if (t >= END) { holdEnd += dt; if (holdEnd > 2.2) { t = 0; holdEnd = 0; capKey = ''; } }
    else t = Math.min(END, t + dt * speed);
  }
  if (!onScreen) return;
  const s = segAt(t);
  if (t !== drawnT || forceDraw) {
    drawLeft(scrL.ctx, t); drawRight(scrR.ctx, t);
    scrL.tex.needsUpdate = true; scrR.tex.needsUpdate = true;
    drawnT = t; forceDraw = false;
  }
  const d = animatePeople(t, amb);
  redLight.intensity = d * 0.9;
  updatePackets(t);
  updateDissolve(t);
  // channel line and padlock
  const link = smooth(t, SEGS[1].a + 3.3, SEGS[1].a + 4.5);
  channel.geometry.setDrawRange(0, Math.max(0, Math.floor((LN + 1) * link)));
  const lockOn = t >= T2.O + 0.2 && t < T2.O + 4.5 + 0.3;
  const lk = lockOn ? backOut(prog(t, T2.O + 0.2, T2.O + 0.7)) * (1 - smooth(t, T2.O + 4.4, T2.O + 4.8)) : 0;
  lock.visible = lk > 0.01; lock.scale.setScalar(Math.max(0.001, lk)); lock.position.y = 4.1 + Math.sin(amb * 2) * 0.03;
  lineMat.color.set(lockOn ? C.light : C.accent);
  lineMat.opacity = t > D0 + 0.5 ? 0.9 * (1 - smooth(t, D0 + 0.5, D0 + 1.5)) : 0.9;
  applyCamera(t, dt, snapNext); snapNext = false;
  updateHud(s);
  renderer.render(scene, camera);
}
let snapNext = true;

/* ---------- controls ---------- */
const bPlay = $('bPlay'), bSpeed = $('bSpeed');
const ICON_PAUSE = '<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.4" height="12" rx="1"/><rect x="9.6" y="2" width="3.4" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2.2v11.6a.5.5 0 0 0 .77.42l9-5.8a.5.5 0 0 0 0-.84l-9-5.8A.5.5 0 0 0 4 2.2z"/></svg>';
function syncPlay() { bPlay.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; bPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play'); bPlay.title = playing ? 'Pause (space)' : 'Play (space)'; }
function seek(to, snap) { t = clamp(to, 0, END); holdEnd = 0; forceDraw = true; capKey = ''; if (snap) snapNext = true; }
bPlay.addEventListener('click', () => { playing = !playing; if (playing && t >= END) seek(0); syncPlay(); });
$('bRestart').addEventListener('click', () => { seek(0); playing = true; syncPlay(); });
const SPEEDS = [0.5, 1, 1.5, 2];
bSpeed.addEventListener('click', () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; bSpeed.textContent = speed + 'x'; });
window.addEventListener('keydown', e => { if (e.code === 'Space' && !/button/i.test((e.target || {}).tagName || '')) { e.preventDefault(); bPlay.click(); } });
if ('IntersectionObserver' in window) new IntersectionObserver(es => { onScreen = es[0].isIntersecting; }, { threshold: 0.05 }).observe(wrap);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('600 24px Inter'), document.fonts.load('400 20px Inter'), document.fonts.load('500 30px "Playfair Display"')])
    .then(() => { forceDraw = true; }).catch(() => {});
}
syncPlay();

/* handle for the host page and for testing */
window.adviceGiverParadigm = {
  seek: (s, snap) => seek(s, snap !== false), pause: () => { playing = false; syncPlay(); }, play: () => { playing = true; syncPlay(); },
  duration: END, segments: SEGS.map(s => ({ id: s.id, a: s.a, b: s.b, trial: s.trial })), events: { T1, T2, D0 }
};
requestAnimationFrame(frame);
})();
</script>
