function $(s){ return document.querySelector(s); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mean(a){ return a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN; }
function sd(a){ const m = mean(a); return a.length > 1 ? Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)) : NaN; }
function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
function fin(x){ return Number.isFinite(x); }
function hash(s){ let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function randn(r){ let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const logistic = x => 1 / (1 + Math.exp(-x));
const logit = p => Math.log(p / (1 - p));
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function deepMerge(t, s){ const out = Array.isArray(t) ? t.slice() : { ...(t || {}) }; for (const k in s){ const v = s[k]; if (v && typeof v === 'object' && !Array.isArray(v)) out[k] = deepMerge(out[k], v); else out[k] = v; } return out; }

const fmtR = r => fin(r) ? (r < 0 ? '−' : '') + Math.abs(r).toFixed(2).replace(/^0/, '') : '–';
const pct0 = x => fin(x) ? Math.round(x * 100) + '%' : '–';
function pearson(xs, ys){
  const p = []; for (let i = 0; i < xs.length; i++) if (fin(xs[i]) && fin(ys[i])) p.push([xs[i], ys[i]]);
  if (p.length < 5) return { r:NaN, n:p.length };
  const mx = mean(p.map(q => q[0])), my = mean(p.map(q => q[1]));
  let sxy = 0, sxx = 0, syy = 0; p.forEach(([x, y]) => { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; });
  return { r: sxx && syy ? sxy / Math.sqrt(sxx * syy) : NaN, n:p.length };
}
// 95% "noise band": |r| needed for p < .05 with n people (t approximated at 2.05)
const rCrit = n => n > 3 ? 2.05 / Math.sqrt(2.05 ** 2 + n - 2) : NaN;

async function makeFirebaseDB(code){
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
  const fs = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
  const app = initializeApp(firebaseConfig, 'intel');
  const db = fs.initializeFirestore(app, { experimentalForceLongPolling: true });
  const sRef = fs.doc(db, ROOT, code);
  const rCol = fs.collection(db, ROOT, code, 'resp');
  const tCol = fs.collection(db, ROOT, code, 'teams');
  const colSnap = cb => snap => { const o = {}; snap.forEach(d => { o[d.id] = d.data(); }); cb(o); };
  return {
    setSession: p => fs.setDoc(sRef, p, { merge:true }),
    onSession: (cb, err) => fs.onSnapshot(sRef, s => cb(s.exists() ? s.data() : null), err),
    setResp: (id, p) => fs.setDoc(fs.doc(rCol, id), p, { merge:true }),
    onResps: (cb, err) => fs.onSnapshot(rCol, colSnap(cb), err),
    setTeam: (id, p) => fs.setDoc(fs.doc(tCol, id), p, { merge:true }),
    onTeams: (cb, err) => fs.onSnapshot(tCol, colSnap(cb), err),
    getSession: async () => { const d = await fs.getDoc(sRef); return d.exists() ? d.data() : null; },
    getTeams: async () => { const snap = await fs.getDocs(tCol); const o = {}; snap.forEach(d => { o[d.id] = d.data(); }); return o; },
    clear: async () => {
      for (const col of [rCol, tCol]){ const snap = await fs.getDocs(col); await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref))); }
      await fs.deleteDoc(sRef);
    }
  };
}
function makeLocalDB(code){
  const KEY = 'int_local_' + code;
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { session:null, resp:{}, teams:{} }; } catch(e){ return { session:null, resp:{}, teams:{} }; } };
  const subs = { session:[], resp:[], teams:[] };
  const emit = () => { const d = read(); subs.session.forEach(f => f(d.session)); subs.resp.forEach(f => f(d.resp || {})); subs.teams.forEach(f => f(d.teams || {})); };
  window.addEventListener('storage', e => { if (e.key === KEY) emit(); });
  const write = fn => { const d = read(); fn(d); try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} setTimeout(emit, 0); return Promise.resolve(); };
  const sub = (k, cb) => { subs[k].push(cb); setTimeout(() => { const d = read(); cb(k === 'session' ? d.session : (d[k] || {})); }, 0); return () => {}; };
  return {
    setSession: p => write(d => { d.session = deepMerge(d.session || {}, p); }),
    onSession: cb => sub('session', cb),
    setResp: (id, p) => write(d => { d.resp = d.resp || {}; d.resp[id] = deepMerge(d.resp[id] || {}, p); }),
    onResps: cb => sub('resp', cb),
    setTeam: (id, p) => write(d => { d.teams = d.teams || {}; d.teams[id] = deepMerge(d.teams[id] || {}, p); }),
    onTeams: cb => sub('teams', cb),
    getSession: async () => read().session,
    getTeams: async () => read().teams || {},
    clear: () => { try { localStorage.removeItem(KEY); } catch(e){} setTimeout(emit, 0); return Promise.resolve(); }
  };
}

function srScore(s, scale){
  const v = SR.filter(it => it.scale === scale).map(it => { const x = s.sr && s.sr[it.id]; return fin(x) ? (it.rev ? 8 - x : x) : NaN; }).filter(fin);
  return v.length ? mean(v) : NaN;
}
function cnt(o, items, f){ return items.filter(it => o && o[it.id] && f(o[it.id])).length; }
function rawScores(s){
  const out = {
    voc: s.vocEnd ? cnt(s.voc, VOCAB, a => a.ok) : NaN,
    ser: s.serEnd ? cnt(s.ser, SERIES, a => a.ok) : NaN,
    rotC: s.rotEnd ? cnt(s.rot, ROT, a => a.ok) : NaN,
    rotW: s.rotEnd ? cnt(s.rot, ROT, a => !a.ok) : NaN,
    eu: cnt(s.eu, EU, () => true) === EU.length ? cnt(s.eu, EU, a => a.ok) : NaN,
    euPred: fin(s.euPred) ? s.euPred : NaN,
    tei: srScore(s, 'tei'), stab: srScore(s, 'stab'), cr: srScore(s, 'cr'),
    aut: Array.isArray(s.aut) ? s.aut.filter(x => String(x).trim().length > 1) : null
  };
  out.rot = fin(out.rotC) ? out.rotC - out.rotW : NaN; // net correct, corrects for 50/50 guessing
  out.flu = out.aut && s.autEnd ? out.aut.length : NaN;
  return out;
}
// Class-level table: g composite and creativity scores need the whole class
function classTable(list){
  list = list || students();
  const rows = list.map(s => ({ id:s.id, sim:!!s.sim, ...rawScores(s) }));
  const z = k => { const v = rows.map(r => r[k]).filter(fin), m = mean(v), d = sd(v); rows.forEach(r => { r['z_' + k] = fin(r[k]) && d > 0 ? (r[k] - m) / d : NaN; }); };
  ['voc','ser','rot'].forEach(z);
  rows.forEach(r => { const zs = [r.z_voc, r.z_ser, r.z_rot]; r.g = zs.every(fin) ? mean(zs) : NaN; });
  // originality (uniqueness weighting): each idea scores 1 minus the share of people who had an idea in the same category.
  // Ideas that match no category are treated as one-offs. "Rare" = a category used by fewer than 15% of people.
  const did = rows.filter(r => r.aut && fin(r.flu));
  const share = {}; did.forEach(r => { new Set(r.aut.map(autCat)).forEach(c => { share[c] = (share[c] || 0) + 1; }); });
  Object.keys(share).forEach(c => share[c] /= Math.max(1, did.length));
  rows.forEach(r => {
    if (!r.aut || !fin(r.flu)){ r.orig = NaN; r.flex = NaN; r.origP = NaN; return; }
    const cats = r.aut.map(autCat), one = 1 / Math.max(1, did.length);
    r.orig = cats.reduce((a, c) => a + (1 - (c === 'Other' ? one : share[c])), 0);
    r.rare = cats.filter(c => c === 'Other' || share[c] < .15).length;
    r.flex = new Set(cats.filter(c => c !== 'Other')).size + cats.filter(c => c === 'Other').length;
    r.origP = r.flu ? r.orig / r.flu : NaN;
  });
  return { rows, share, nAut: did.length };
}

function corrOf(rows, a, b){ return pearson(rows.map(r => r[a]), rows.map(r => r[b])); }
// first principal component of a correlation matrix (power iteration); returns loadings and share of variance
function firstPC(R){
  const k = R.length; let v = Array(k).fill(1 / Math.sqrt(k)), lam = 0;
  for (let it = 0; it < 200; it++){ const w = R.map(row => row.reduce((s, x, j) => s + x * v[j], 0)); lam = Math.sqrt(w.reduce((s, x) => s + x * x, 0)); if (!lam) break; v = w.map(x => x / lam); }
  if (v.reduce((s, x) => s + x, 0) < 0) v = v.map(x => -x);
  return { load: v.map(x => x * Math.sqrt(lam)), share: lam / k };
}
function doneFor(s, ph){

const SIM_PREV = [.7, .75, .55, .55, .3, .3, .3, .25, .3, .2, .2, .12, .1, .1, .08, .08, .3];
const SIM_STUDY = [
  'Give 300 people this test, an IQ battery and a Big Five measure, then see whether it predicts grades one year later after controlling for both.',
  'Factor-analyse it with a broad CHC battery: does it form its own factor or load on g?',
  'Test patients with focal brain lesions: can it be impaired while IQ is intact, and vice versa?',
  'Follow children from 5 to 18 and check whether it develops on a different trajectory from fluid intelligence.',
  'Check test–retest reliability over six months, and whether expert and consensus scoring agree.'
];
const SIM_SEED = 'sim-60'; // fixed so rehearsals show the same, representative class
function simulateClass(n, nT){
  const r = rng(hash(SIM_SEED));
  const resps = {}, teams = {};
  for (let i = 0; i < n; i++){
    const g = randn(r), P = randn(r), O = randn(r), E = randn(r), spd = randn(r);
    const s = { team: TEAM_NAMES[i % nT], sim:true, sr:{}, voc:{}, ser:{}, rot:{}, eu:{}, vocEnd:true, serEnd:true, rotEnd:true, autEnd:true };
    // latent task abilities: each loads on g (positive manifold) plus a specific part
    const tV = .85 * g + .53 * randn(r), tS = .85 * g + .53 * randn(r), tR = .75 * g + .66 * randn(r);
    VOCAB.forEach(it => { const ok = r() < logistic(logit(it.p) + 1.3 * tV); s.voc[it.id] = { c: ok ? 0 : 1 + Math.floor(r() * 3), ok }; });
    const nS = clamp(Math.round(9 + 2 * tS + .5 * spd + .6 * randn(r)), 4, SERIES.length);
    SERIES.slice(0, nS).forEach(it => { const ok = r() < logistic(logit(it.p) + 1.4 * tS); s.ser[it.id] = { v: ok ? it.a : it.a + 1, ok }; });
    const nR = clamp(Math.round(15 + 3.5 * tR + 1.5 * spd + randn(r)), 6, ROT.length);
    ROT.slice(0, nR).forEach(it => { s.rot[it.id] = { c: 0, ok: r() < clamp(logistic(1.3 + 1.1 * tR), .5, .99) }; });
    // ability EI: modest g link, weak personality link; trait EI: mostly personality
    const tEU = .4 * g + .05 * P + .9 * E;
    EU.forEach(it => { const ok = r() < logistic(logit(it.p) + .9 * tEU); s.eu[it.id] = { c: ok ? 0 : 1 + Math.floor(r() * 3), ok }; });
    const tTEI = .8 * P + .15 * E + .1 * g + .55 * randn(r);
    SR.forEach(it => {
      const lat = it.scale === 'tei' ? tTEI : it.scale === 'stab' ? .85 * P + .5 * randn(r) : .7 * O + .7 * randn(r);
      const base = it.scale === 'stab' ? 4.1 : 4.8; let v = clamp(Math.round(base + 1.1 * lat + .7 * randn(r)), 1, 7);
      s.sr[it.id] = it.rev ? 8 - v : v;
    });
    const actual = EU.filter(it => s.eu[it.id].ok).length;
    s.euPred = clamp(Math.round(6.5 + .9 * tTEI + .15 * (actual - 7) + 1.2 * randn(r)), 0, 10);
    // brick uses: fluency from openness (and a little g); rarer ideas more likely with high openness
    const flu = clamp(Math.round(7 + 2.3 * (.55 * O + .35 * g + .55 * randn(r))), 2, 18);
    const used = new Set(), list = [];
    let guard = 0;
    while (list.length < flu && guard++ < 200){
      const w = SIM_PREV.map(p => Math.pow(p, clamp(1 - .35 * O, .35, 1.6)));
      let u = r() * w.reduce((a, b) => a + b, 0), k = 0; while (u > w[k]){ u -= w[k]; k++; }
      const opts = SIM_AUT[Math.min(k, SIM_AUT.length - 1)], t = opts[Math.floor(r() * opts.length)];
      if (!used.has(t)){ used.add(t); list.push(t); }
    }
    s.aut = list;
    s.pre = clamp(Math.round(3.6 + .6 * tTEI * .5 + randn(r) * .9), 1, 5);
    s.post = clamp(Math.round(s.pre - .3 - r() * 1.1), 1, 5);
    resps['sim' + i] = s;
  }
  for (let t = 0; t < nT; t++){
    const T = TEAM_NAMES[t], c = candFor(T), card = {};
    const bias = { tei:[3,0,2,3,3,0], aei:[1,0,1,3,3,1], cre:[1,1,1,0,0,0], pra:[2,2,2,3,3,3], soc:[1,1,3,0,0,1], mus:[2,1,3,0,1,0], aip:[3,1,3,3,3,3], met:[1,0,3,3,1,1] }[c.id];
    CRIT.forEach((cr, j) => { const b = bias[j], k = r() < .7 ? b : Math.floor(r() * 4); card[cr.id] = VERD[k][0]; });
    card.overall = { tei:'no', aei:'partly', cre:'partly', pra:'no', soc:'partly', mus:'partly', aip:'no', met:'partly' }[c.id];
    card.study = SIM_STUDY[t % SIM_STUDY.length];
    teams[T] = { card, done:true };
  }
  return { resps, teams };
}

const COL = { accent:'#e64626', ink:'#111111', grey:'#9a9a9a', light:'#f3a48f', dark:'#555555', pale:'#d9d9d9', neg:'#3d5a80' };
function frame(o){
  const W = o.W || 900, H = o.H || 440, m = { l:70, r:24, t:18, b:62, ...(o.m || {}) };
  const sx = x => m.l + (x - o.x0) / (o.x1 - o.x0) * (W - m.l - m.r);
  const sy = y => H - m.b - (y - o.y0) / (o.y1 - o.y0) * (H - m.t - m.b);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" font-family="Arial, Helvetica, sans-serif">`;
  (o.yTicks || []).forEach(t => { g += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="#ececec"/><text x="${m.l - 10}" y="${sy(t) + 5}" text-anchor="end" font-size="15" fill="#555">${o.yFmt ? o.yFmt(t) : t}</text>`; });
  (o.xTicks || []).forEach(t => { g += `<text x="${sx(t)}" y="${H - m.b + 24}" text-anchor="middle" font-size="15" fill="#555">${o.xFmt ? o.xFmt(t) : t}</text>`; });
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="#111"/>`;
  if (o.xLabel) g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 12}" text-anchor="middle" font-size="15" fill="#111">${o.xLabel}</text>`;
  if (o.yLabel) g += `<text transform="translate(18 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle" font-size="15" fill="#111">${o.yLabel}</text>`;
  return { W, H, m, sx, sy, g };
}
function barChart(o){
  const groups = o.groups, ns = o.series.length;
  const f = frame({ ...o, x0:0, x1:groups.length, xTicks:[] }); let g = f.g;
  const gw = (f.W - f.m.l - f.m.r) / groups.length, pad = gw * .16, bw = (gw - 2 * pad) / ns;
  (o.bands || []).forEach(b => { g += `<rect x="${f.m.l}" width="${f.W - f.m.l - f.m.r}" y="${f.sy(b.hi)}" height="${f.sy(b.lo) - f.sy(b.hi)}" fill="#000" fill-opacity=".05"/><text x="${f.m.l + 8}" y="${f.sy(b.lo) - 8}" font-size="12.5" fill="#777">${b.label}</text>`; });
  groups.forEach((lab, gi) => {
    g += `<text x="${f.m.l + gw * (gi + .5)}" y="${f.H - f.m.b + 24}" text-anchor="middle" font-size="15" fill="#111">${lab}</text>`;
    if (o.groupSub && o.groupSub[gi]) g += `<text x="${f.m.l + gw * (gi + .5)}" y="${f.H - f.m.b + 42}" text-anchor="middle" font-size="12" fill="#777">${o.groupSub[gi]}</text>`;
    o.series.forEach((s, si) => {
      const v = s.vals[gi]; if (!fin(v)) return;
      const base = (o.y0 < 0 && o.y1 > 0) ? 0 : o.y0, vv = clamp(v, o.y0, o.y1);
      const x = f.m.l + gw * gi + pad + bw * si, yTop = f.sy(Math.max(vv, base)), yBot = f.sy(Math.min(vv, base));
      g += `<rect x="${x + 2}" y="${yTop}" width="${bw - 4}" height="${Math.max(0, yBot - yTop)}" fill="${s.color}"/>`;
      const y = vv >= base ? yTop : yBot + 22;
      g += `<text x="${x + bw / 2}" y="${y - 7}" text-anchor="middle" font-size="14" fill="#111">${o.vFmt ? o.vFmt(v) : fmtNum(v)}</text>`;
    });
  });
  if (o.y0 < 0 && o.y1 > 0) g += `<line x1="${f.m.l}" x2="${f.W - f.m.r}" y1="${f.sy(0)}" y2="${f.sy(0)}" stroke="#111"/>`;
  return `<div class="chart">${g}</svg></div>`;
}
function hbar(o){ // horizontal bars: o.rows [{label, v, color}]
  const n = o.rows.length, rowH = 34, L = o.L || 220, W = o.W || 900, H = 20 + n * rowH + 30, max = o.max || Math.max(...o.rows.map(r => r.v), .01);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" font-family="Arial, Helvetica, sans-serif">`;
  o.rows.forEach((r, i) => {
    const y = 14 + i * rowH, w = (W - L - 80) * r.v / max;
    g += `<text x="${L - 10}" y="${y + 17}" text-anchor="end" font-size="15" fill="#111">${esc(r.label)}</text><rect x="${L}" y="${y + 2}" width="${Math.max(0, w)}" height="${rowH - 10}" fill="${r.color || COL.accent}"/><text x="${L + w + 8}" y="${y + 18}" font-size="14" fill="#111">${o.vFmt ? o.vFmt(r.v) : fmtNum(r.v)}</text>`;
  });
  return `<div class="chart">${g}</svg></div>`;
}
function scatter(o){
  const f = frame(o); let g = f.g;
  if (o.diag) g += `<line x1="${f.sx(Math.max(o.x0, o.y0))}" y1="${f.sy(Math.max(o.x0, o.y0))}" x2="${f.sx(Math.min(o.x1, o.y1))}" y2="${f.sy(Math.min(o.x1, o.y1))}" stroke="#999" stroke-dasharray="6 5"/>`;
  if (o.fit){
    const p = o.pts.filter(q => fin(q.x) && fin(q.y));
    if (p.length >= 5){ const mx = mean(p.map(q => q.x)), my = mean(p.map(q => q.y)); let sxy = 0, sxx = 0; p.forEach(q => { sxy += (q.x - mx) * (q.y - my); sxx += (q.x - mx) ** 2; });
      if (sxx){ const b = sxy / sxx, a = my - b * mx; const xa = o.x0, xb = o.x1; g += `<line x1="${f.sx(xa)}" y1="${f.sy(clamp(a + b * xa, o.y0, o.y1))}" x2="${f.sx(xb)}" y2="${f.sy(clamp(a + b * xb, o.y0, o.y1))}" stroke="${COL.ink}" stroke-width="2.5" stroke-opacity=".7"/>`; } }
  }
  const jr = rng(7);
  o.pts.forEach(p => { if (!fin(p.x) || !fin(p.y)) return; const jx = (o.jitter || 0) * (jr() - .5), jy = (o.jitterY ?? o.jitter ?? 0) * (jr() - .5); g += `<circle cx="${f.sx(clamp(p.x + jx, o.x0, o.x1))}" cy="${f.sy(clamp(p.y + jy, o.y0, o.y1))}" r="${p.r || 8}" fill="${p.color || COL.accent}" fill-opacity=".75" stroke="#fff" stroke-width="1.5"/>`; });
  return `<div class="chart">${g}</svg></div>`;
}
function heatColor(r){
  if (!fin(r)) return ['#f6f6f6', '#999'];
  const t = Math.min(1, Math.abs(r)), c = r >= 0 ? [230,70,38] : [61,90,128];
  const mix = c.map(x => Math.round(255 + (x - 255) * t));
  return [`rgb(${mix.join(',')})`, t > .55 ? '#fff' : '#111'];
}
function heatmap(labels, M, o = {}){ // lower triangle, without the diagonal
  const n = labels.length, cell = o.cell || 78, L = o.L || 290, T = 10, B = o.B || 150;
  const W = L + (n - 1) * cell + 20, H = T + (n - 1) * cell + B;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" font-family="Arial, Helvetica, sans-serif">`;
  for (let i = 1; i < n; i++){
    g += `<text x="${L - 10}" y="${T + (i - 1) * cell + cell / 2 + 5}" text-anchor="end" font-size="15" fill="#111">${esc(labels[i])}</text>`;
    for (let j = 0; j < i; j++){
      const [bg, fg] = heatColor(M[i][j]), x = L + j * cell, y = T + (i - 1) * cell;
      g += `<rect x="${x + 1}" y="${y + 1}" width="${cell - 2}" height="${cell - 2}" fill="${bg}"/><text x="${x + cell / 2}" y="${y + cell / 2 + 6}" text-anchor="middle" font-size="17" fill="${fg}">${fmtR(M[i][j])}</text>`;
    }
  }
  for (let j = 0; j < n - 1; j++){ const x = L + j * cell + cell / 2, y = T + (n - 1) * cell + 12; g += `<text transform="translate(${x} ${y}) rotate(-35)" text-anchor="end" font-size="14" fill="#111">${esc(labels[j])}</text>`; }

const legend = items => `<div class="legend">${items.map(i => `<span><i style="background:${i.color}"></i>${i.name}</span>`).join('')}</div>`;
const keystats = items => `<div class="keystats">${items.map(i => `<div class="ks"><div class="n">${i.n}</div><div class="l">${i.l}</div></div>`).join('')}</div>`;
const tutor = t => `<div class="tutor"><b>Tutor prompt</b>${t}</div>`;
const tick = (a, b, s) => { const o = []; for (let x = a; x <= b + 1e-9; x += s) o.push(Math.round(x * 100) / 100); return o; };

/* =====================================================================
   RENDER: student
   ===================================================================== */
function saveMe(patch){ S.me = deepMerge(S.me, patch); S.db.setResp(S.pid, patch).catch(showError); render(true); }
function order(round, items){ return shuffle(items, rng(hash(S.pid + round))); }
function optOrder(id, k){ return shuffle([...Array(k).keys()], rng(hash(S.pid + id))); }

function renderStudent(force){
  const ph = curPhase();
  const view = studentView(ph);
  if (!force && view.key === S.lastKey) return;
  // keep focus and caret in a text box that is being typed into when a teammate's change re-renders the page
  const act = document.activeElement, keep = act && act.id && (act.tagName === 'TEXTAREA' || act.tagName === 'INPUT') ? { id:act.id, v:act.value, a:act.selectionStart, b:act.selectionEnd } : null;
  S.lastKey = view.key;
  S.timer = view.timer || null;
  $('#app').innerHTML = `<div class="wrap">${S.ui.error}${view.html}</div>`;
  if (view.bind) view.bind();
  if (keep){ const el = document.getElementById(keep.id); if (el){ el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch(e){} } }
  tickTimer();
}
function tickTimer(){
  const t = S.timer; if (!t) return;
  const left = t.end - Date.now(), el = $('#timer');
  if (el){ el.textContent = fmtTime(left / 1000); el.classList.toggle('low', left < 10000); }
  if (left <= 0 && !t.fired){ t.fired = true; setTimeout(() => { if (!S.me[t.endKey]) saveMe({ [t.endKey]: true }); }, 0); }
}
function wait(title, sub){ return { key:'wait:' + title, html:`<div class="big-wait"><div class="label"><span class="dotpulse"></span>${S.me.team ? 'Team ' + S.me.team : ''}</div><h1>${title}</h1><p class="lede">${sub || ''}</p></div>` }; }
function header(label, i, n, timer){ return `<div class="prog"><span>${label}</span><span class="row" style="gap:10px">${timer ? '<span class="timer" id="timer"></span>' : ''}<span>${Math.min(i + 1, n)} / ${n}</span></span></div><div class="bar"><i style="width:${100 * i / n}%"></i></div>`; }

function studentView(ph){
  if (!S.session){
    const late = Date.now() - S.bootAt > 8000;
    return { key:'nosess' + late, html:`<div class="big-wait"><div class="label"><span class="dotpulse"></span>Session ${S.code}</div><h1>Waiting for your tutor</h1><p class="lede">The session has not started yet. Keep this page open.</p>
      ${late ? `<p class="tiny">Still waiting? Check the code on the screen matches <strong>${S.code}</strong>.${S.local ? '' : ' If your tutor is rehearsing offline, the link needs <code>&amp;local=1</code> and must be opened in the same browser.'}</p>` : ''}</div>` };
  }
  if (!S.me.team) return teamPicker();
  switch (ph){
    case 'lobby': return wait(`You're in Team ${S.me.team}`, 'Find your teammates. This is a class demonstration, not an IQ test: nobody sees individual answers, and a few minutes of items can\'t say anything meaningful about you.');
    case 'pre': return viewPoll('pre', 'Before we start');
    case 'bat': return viewBattery();
    case 'court': return viewCourt();

function teamPicker(){
  const n = nTeams();
  return { key:'team' + n, html:`<div class="label">Welcome</div><h1>Pick your team</h1><p class="lede">Sit with your team. Your answers are anonymous: nobody sees individual responses.</p>
    <div class="teams">${TEAM_NAMES.slice(0, n).map(t => `<button class="teambtn" data-t="${t}">Team ${t}</button>`).join('')}</div>`,
    bind: () => document.querySelectorAll('.teambtn').forEach(b => b.onclick = () => saveMe({ team:b.dataset.t, joined:Date.now() })) };
}
function viewPoll(field, label){
  if (fin(S.me[field])) return wait('Vote in', field === 'pre' ? 'Eyes on the screen.' : 'Eyes on the screen for the final result.');
  return { key:'poll' + field, html:`<div class="label">${label}</div><h2>How much do you agree?</h2><div class="q">"${POLL}"</div>
    <div class="likert">${POLL_OPTS.map((o, i) => `<button class="opt" data-v="${i + 1}">${o}</button>`).join('')}</div>`,
    bind: () => document.querySelectorAll('.likert .opt').forEach(b => b.onclick = () => saveMe({ [field]: Number(b.dataset.v) })) };
}

/* ---------- the battery ---------- */
function viewBattery(){
  const me = S.me;
  if (!me.sr || SR.some(it => !fin(me.sr[it.id]))) return viewSR();
  if (!me.vocEnd) return timedTask('voc');
  if (!me.serEnd) return timedTask('ser');
  if (!me.rotEnd) return timedTask('rot');
  if (EU.some(it => !(me.eu && me.eu[it.id]))) return viewEU();
  if (!fin(me.euPred)) return viewPred();
  if (!me.autEnd) return timedTask('aut');
  return wait('All done', 'Thanks. Eyes on the big screen for the class results.');
}
const STEP = { sr:'1 of 6', voc:'2 of 6', ser:'3 of 6', rot:'4 of 6', eu:'5 of 6', aut:'6 of 6' };
function viewSR(){
  const sel = { ...(S.me.sr || {}), ...S.ui.sr };
  const all = () => SR.every(it => fin({ ...(S.me.sr || {}), ...S.ui.sr }[it.id]));
  return { key:'sr', html:`<div class="label">Part ${STEP.sr} · About you</div><h2>How well does each statement describe you?</h2><p class="muted">1 = not at all, 7 = completely. Go with your first reaction.</p>
    ${SR.map(it => `<div class="sr"><div class="st">${it.q}</div><div class="chips seven">${[1,2,3,4,5,6,7].map(v => `<button class="chip ${sel[it.id] === v ? 'on' : ''}" data-id="${it.id}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('')}
    <div class="sub"><button class="btn block" id="srgo" ${all() ? '' : 'disabled'}>Next</button></div>`,
    bind: () => {
      document.querySelectorAll('.sr .chip').forEach(b => b.onclick = () => {
        S.ui.sr[b.dataset.id] = Number(b.dataset.v);
        b.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
        $('#srgo').disabled = !all();
      });
      $('#srgo').onclick = () => saveMe({ sr: { ...(S.me.sr || {}), ...S.ui.sr } });
    } };
}
const TASKS = {
  voc: { title:'Word meanings', intro:'Pick the word or phrase closest in meaning to the word in capitals. Go as fast as you can without guessing wildly.', items:VOCAB },
  ser: { title:'Number series', intro:'Type the number that comes next in each series. If you\'re stuck, skip it: the clock keeps running.', items:SERIES },
  rot: { title:'Same or mirror?', intro:'The right-hand shape is the left-hand one rotated. Is it the same shape, or a mirror image? Wrong answers count against you, so don\'t just tap randomly.', items:ROT },
  aut: { title:'Uses for a brick', intro:'List as many different uses for a brick as you can. Common or unusual, practical or silly: anything goes. Add one idea at a time.', items:[] }
};
function timedTask(k){
  const me = S.me, T = TASKS[k], t0 = me[k + 'T0'];
  if (!t0){
    const ex = k === 'rot' ? `<div class="rotpair" style="max-width:340px"><div>${rotSVG('R', 0, false)}</div><div>${rotSVG('R', 120, true)}</div></div><p class="tiny" style="margin:-8px 0 12px">Example: this pair is a <strong>mirror</strong> image.</p>` : '';
    return { key:'intro' + k, html:`<div class="label">Part ${STEP[k]}</div><h1>${T.title}</h1><p class="lede">${T.intro}</p>${ex}
      <div class="card soft"><div class="stat" style="border:0"><span>Time limit</span><b>${fmtTime(T_LIMIT[k])}</b></div></div>
      <div class="sub"><button class="btn block" id="start">Start the clock</button></div>`,
      bind: () => { $('#start').onclick = () => saveMe({ [k + 'T0']: Date.now() }); } };
  }
  const timer = { end: t0 + T_LIMIT[k] * 1000, endKey: k + 'End' };
  if (Date.now() >= timer.end){ setTimeout(() => { if (!S.me[k + 'End']) saveMe({ [k + 'End']: true }); }, 0); return wait('Time\'s up', ''); }
  if (k === 'aut') return viewAUT(timer);
  const done = me[k] || {}, items = T.items;
  const i = items.findIndex(it => !done[it.id]);
  if (i < 0){ setTimeout(() => { if (!S.me[k + 'End']) saveMe({ [k + 'End']: true }); }, 0); return wait('Nice, all done', 'Next task coming up…'); }
  const it = items[i], lab = `Part ${STEP[k]} · ${T.title}`;
  if (k === 'voc'){
    const oo = optOrder(it.id, 4);
    return { key:'voc:' + it.id, timer, html: header(lab, i, items.length, true) + `<div class="q" style="font-family:var(--mono);font-size:24px;letter-spacing:.06em">${it.w}</div>
      <div class="opts">${oo.map(j => `<button class="opt" data-j="${j}">${it.o[j]}</button>`).join('')}</div>`,
      bind: () => document.querySelectorAll('.opt').forEach(b => b.onclick = () => { const j = Number(b.dataset.j); saveMe({ voc:{ [it.id]:{ c:j, ok:j === 0 } } }); }) };
  }
  if (k === 'ser'){
    return { key:'ser:' + it.id, timer, html: header(lab, i, items.length, true) + `<div class="series">${it.q}, ?</div>
      <input class="txt" id="sv" inputmode="numeric" placeholder="Next number" autocomplete="off">
      <div class="sub row"><button class="btn" id="sgo" style="flex:1">Submit</button><button class="btn ghost" id="sskip">Skip</button></div>`,
      bind: () => {
        const send = raw => { const v = parseFloat(String(raw).replace(/[, ]/g, '')); saveMe({ ser:{ [it.id]:{ v: fin(v) ? v : null, ok: v === it.a } } }); };
        $('#sv').focus(); $('#sgo').onclick = () => { if ($('#sv').value.trim()) send($('#sv').value); else $('#sv').focus(); };
        $('#sv').onkeydown = e => { if (e.key === 'Enter' && $('#sv').value.trim()) send($('#sv').value); };
        $('#sskip').onclick = () => send('');
      } };
  }
  // rotation
  return { key:'rot:' + it.id, timer, html: header(lab, i, items.length, true) + `<div class="rotpair"><div>${rotSVG(it.g, 0, false)}</div><div>${rotSVG(it.g, it.ang, it.mirror)}</div></div>
    <div class="row"><button class="btn ghost" id="same" style="flex:1;padding:16px">Same</button><button class="btn ghost" id="mirr" style="flex:1;padding:16px">Mirror</button></div>`,
    bind: () => { const send = m => saveMe({ rot:{ [it.id]:{ c: m ? 1 : 0, ok: m === it.mirror } } }); $('#same').onclick = () => send(false); $('#mirr').onclick = () => send(true); } };
}
function viewEU(){
  const items = order('eu', EU), done = S.me.eu || {};
  const i = items.findIndex(it => !done[it.id]), it = items[i], oo = optOrder(it.id, 4);
  return { key:'eu:' + it.id, html: header(`Part ${STEP.eu} · Understanding emotions`, i, items.length) + `<div class="q" style="font-size:22px">${it.q}</div>
    <div class="opts">${oo.map(j => `<button class="opt" data-j="${j}">${it.o[j]}</button>`).join('')}</div><p class="tiny" style="margin-top:12px">No time limit. Pick the best answer.</p>`,
    bind: () => document.querySelectorAll('.opt').forEach(b => b.onclick = () => { const j = Number(b.dataset.j); saveMe({ eu:{ [it.id]:{ c:j, ok:j === 0 } } }); }) };

function viewPred(){
  const v = S.ui.predV ?? 5;
  return { key:'pred', html:`<div class="label">Part ${STEP.eu} · Quick question</div><h2>How many of the ${EU.length} emotion questions do you think you got right?</h2>

    <input type="range" min="0" max="${EU.length}" step="1" value="${v}" id="pr">
    <div class="sub"><button class="btn block" id="ps">Submit</button></div>`,
    bind: () => { $('#pr').oninput = e => { S.ui.predV = Number(e.target.value); $('#pv').textContent = `${S.ui.predV} out of ${EU.length}`; }; $('#ps').onclick = () => saveMe({ euPred: S.ui.predV ?? 5 }); } };

function viewAUT(timer){

/* ---------- courtroom ---------- */

    <div class="crit"><div class="cn">The one study that would convince a sceptic</div><div class="cd">Design it in a sentence or two: who, what you'd measure, and what result would settle it.</div>

    <div class="crit"><div class="cn">Your verdict</div><div class="cd">Does it earn the name "intelligence"?</div>
      <div class="opts">${OVERALL.map(([k, l]) => `<button class="opt ${card.overall === k ? 'on' : ''}" data-o="${k}">${l}</button>`).join('')}</div></div>

/* ---------- Reveal 1: g and EI ---------- */
function stageRV1(){
  const t = tabs('rv1', PHASES.find(p => p.id === 'rv1').reveal);
  const ct = classTable(), R = ct.rows, body = [];
  if (t.cur === 'pm'){
    const keys = ['voc','ser','rot'], labs = ['Vocabulary (Gc)','Number series (Gf)','Rotation (Gv)'];
    const full = R.filter(r => keys.every(k => fin(r[k])));
    const M = keys.map(a => keys.map(b => a === b ? 1 : corrOf(full, a, b).r));
    const ok = M.flat().every(fin), pc = ok ? firstPC(M) : null;
    const offd = [M[1][0], M[2][0], M[2][1]], rc = rCrit(full.length);
    body.push(`<div class="label">Reveal 1a</div><h1>Do the thinking tasks hang together?</h1>
      <p class="prompt">Correlations between your class's scores on three very different tasks: word knowledge, number reasoning and mental rotation.</p>${enough(full.length, 12)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center">
        ${heatmap(labs, M, { cell:110, L:200, B:140 })}
        ${pc ? `<div><div class="label" style="margin-bottom:4px">Loadings on the first factor ("g")</div>${hbar({ rows: labs.map((l, i) => ({ label:l, v:pc.load[i] })), max:1, L:190, W:560, vFmt:v => fmtR(v) })}</div>` : '<p class="muted">Needs at least five people who finished all three tasks.</p>'}
      </div>
      ${keystats([{ n: fmtR(mean(offd.filter(fin))), l:'average correlation between tasks' }, { n: pc ? pct0(pc.share) : '–', l:'of the variance captured by one general factor' }, { n: fin(rc) ? '±' + fmtR(rc).replace('−', '') : '–', l:`noise band: with n = ${full.length}, smaller correlations could easily be chance` }])}
      ${tutor('The positive manifold, live (Lecture 4). If all three correlations are positive, ask: why should knowing what "laconic" means predict how fast you can rotate a letter? Spearman\'s answer was g; stress that g is a statistical extraction (what is common to the tasks), not a thing in the head. With 30 people, expect wobble: one correlation may come out near zero. That is a sample-size lesson, not a refutation (Carroll used 460+ data sets).')}`);
  } else if (t.cur === 'mx'){
    const M = MEAS.map(([a]) => MEAS.map(([b]) => a === b ? 1 : corrOf(R, a, b).r));
    const n = R.filter(r => fin(r.g) && fin(r.eu) && fin(r.tei)).length;
    body.push(`<div class="label">Reveal 1b</div><h1>Everything we measured</h1>
      <p class="prompt">Orange = positive correlation, blue = negative. Darker = stronger. Look for clusters.</p>${enough(n, 12)}
      ${heatmap(MEAS.map(m => m[1]), M, { cell:76, L:300, B:200 })}
      ${tutor('Three clusters to look for: (1) the thinking tasks with each other; (2) trait EI with emotional stability: two self-reports, both personality-flavoured; (3) brick fluency with originality. Then ask: which measure sits where you\'d expect an "intelligence" to sit? Construct vs measure: every cell here is a correlation between <em>measures</em>, and each measure is a narrow window on its construct.')}`);
  } else if (t.cur === 'ei'){
    const c = (a, b) => corrOf(R, a, b);
    const A = [c('eu', 'g'), c('eu', 'stab')], T = [c('tei', 'g'), c('tei', 'stab')], AT = c('eu', 'tei');
    const nMin = Math.min(...A.concat(T).map(x => x.n)), rc = rCrit(nMin);
    body.push(`<div class="label">Reveal 1c</div><h1>Two kinds of "emotional intelligence"</h1>
      <p class="prompt">Ability EI: the emotion questions with right answers. Trait EI: how good you <em>said</em> you are with emotions. How does each relate to the thinking tasks (g) and to personality (emotional stability)?</p>${enough(nMin, 12)}
      ${legend([{ name:'Ability EI (emotion questions)', color:COL.accent }, { name:'Trait EI (self-report)', color:COL.ink }])}
      ${barChart({ groups:['Correlation with g (thinking tasks)','Correlation with emotional stability'], series:[{ name:'Ability', color:COL.accent, vals:A.map(x => x.r) }, { name:'Trait', color:COL.ink, vals:T.map(x => x.r) }], y0:-.5, y1:1, yTicks:tick(-.5, 1, .25), yFmt:fmtR, yLabel:'Correlation (r)', vFmt:fmtR, bands: fin(rc) ? [{ lo:-rc, hi:rc, label:'Shaded: noise band for n = ' + nMin + ' (bars inside it could be chance)' }] : [] })}
      ${keystats([{ n: fmtR(AT.r), l:'ability EI with trait EI: do the two "EIs" even agree?' }, { n:'.10 to .30', l:'ability EI with g in the literature' }, { n:'≈ .85', l:'trait EI with the general factor of personality (meta-analytic)' }])}
      ${tutor('Lecture 7, slide "The measure determines the conclusion". Expected pattern: ability EI correlates modestly with g and weakly with personality; trait EI barely with g but clearly with emotional stability. So whether "EI" is a new intelligence or relabelled personality depends on which measure you pick. Ask: if you only had the trait measure, what would you conclude about EI?')}`);
  } else {
    const pts = R.filter(r => fin(r.eu) && fin(r.euPred)), pts2 = R.filter(r => fin(r.eu) && fin(r.tei));
    const rp = corrOf(R, 'euPred', 'eu'), rt = corrOf(R, 'tei', 'eu');
    body.push(`<div class="label">Reveal 1d</div><h1>Do you know how good you are with emotions?</h1>
      <p class="prompt">Left: your predicted score on the emotion questions against your actual score. Right: your self-rated (trait) EI against the same actual score.</p>${enough(pts.length, 12)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        ${scatter({ W:560, H:460, pts: pts.map(r => ({ x:r.euPred, y:r.eu })), x0:0, x1:10, y0:0, y1:10, xTicks:tick(0, 10, 2), yTicks:tick(0, 10, 2), xLabel:'Predicted score', yLabel:'Actual score', diag:true, jitter:.5, fit:true })}
        ${scatter({ W:560, H:460, pts: pts2.map(r => ({ x:r.tei, y:r.eu, color:COL.ink })), x0:1, x1:7, y0:0, y1:10, xTicks:tick(1, 7, 1), yTicks:tick(0, 10, 2), xLabel:'Self-rated EI (1–7)', yLabel:'Actual score', jitter:.3, fit:true })}
      </div>
      ${keystats([{ n: fmtNum(mean(pts.map(r => r.euPred))) + ' / ' + fmtNum(mean(pts.map(r => r.eu))), l:'average predicted / actual score' }, { n: fmtR(rp.r), l:'prediction with actual score (resolution across people)' }, { n: fmtR(rt.r), l:'self-rated EI with actual score' }])}
      ${tutor('"Self-reported ability is not actual ability" (Lecture 7). Points above the dashed line did better than they predicted. Link to Lectures 1–3: this is a metacognitive judgement about an emotional skill. A weak correlation on the right is the core problem with trait EI as a measure of <em>ability</em>; it may still measure something useful (emotional self-efficacy).')}`);
  }
  return t.html + body.join('');
}

/* ---------- Reveal 2: creativity ---------- */
function stageRV2(){
  const t = tabs('rv2', PHASES.find(p => p.id === 'rv2').reveal);
  const ct = classTable(), R = ct.rows.filter(r => fin(r.flu)), body = [];
  if (t.cur === 'flu'){
    const r1 = corrOf(R, 'flu', 'orig'), r2 = corrOf(R, 'flu', 'origP');
    const mx = Math.max(10, ...R.map(r => r.flu)) + 1;
    body.push(`<div class="label">Reveal 2a</div><h1>More ideas = more original?</h1>
      <p class="prompt">Each idea scores for rarity: 1 minus the share of the class who had a similar idea (a doorstop scores low, a one-off scores close to 1). Left: your total originality score. Right: your <em>average</em> originality per idea.</p>${enough(R.length, 12)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        ${scatter({ W:560, H:440, pts: R.map(r => ({ x:r.flu, y:r.orig })), x0:0, x1:mx, y0:0, y1:Math.max(6, ...R.map(r => r.orig)) + 1, xTicks:tick(0, mx, 4), yTicks:tick(0, 20, 2), xLabel:'Fluency (number of ideas)', yLabel:'Originality: total score', jitter:.4, fit:true })}
        ${scatter({ W:560, H:440, pts: R.map(r => ({ x:r.flu, y:r.origP, color:COL.ink })), x0:0, x1:mx, y0:0, y1:1, xTicks:tick(0, mx, 4), yTicks:tick(0, 1, .25), yFmt:v => v.toFixed(2), xLabel:'Fluency (number of ideas)', yLabel:'Originality: average per idea', jitter:.4, fit:true })}
      </div>
      ${keystats([{ n: fmtR(r1.r), l:'fluency with total originality' }, { n: fmtR(r2.r), l:'fluency with average originality' }, { n: fmtNum(mean(R.map(r => r.flu))), l:'average number of ideas' }])}
      ${tutor('The fluency confound (Lecture 9): a total originality score rises just because you produced more ideas. Switch to the average per idea and most of the relationship goes. Same people, same answers, a different scoring rule, a different conclusion about who is "creative". Ask: which scoring rule would you defend, and why?')}`);
  } else if (t.cur === 'cat'){
    const rows = Object.entries(ct.share).filter(([c]) => c !== 'Other').sort((a, b) => b[1] - a[1]).slice(0, 12).map(([c, v]) => ({ label:c, v, color: v < .15 ? COL.light : COL.accent }));
    const others = [...new Set(R.flatMap(r => r.aut.filter(x => autCat(x) === 'Other').map(x => x.trim())))];
    const nResp = R.reduce((a, r) => a + r.flu, 0);
    body.push(`<div class="label">Reveal 2b</div><h1>What the room said</h1>
      <p class="prompt">Share of people who gave at least one idea in each category. Pale bars: fewer than 15% thought of it, so it counts as rare.</p>${enough(R.length, 12)}
      ${rows.length ? hbar({ rows, max:1, vFmt:v => Math.round(v * 100) + '%' }) : ''}
      ${keystats([{ n: nResp, l:'ideas in total' }, { n: others.length, l:'different ideas that fit no category' }, { n: ct.share['Doorstop'] ? pct0(ct.share['Doorstop']) : '–', l:'said "doorstop" (or similar)' }])}
      <div class="controls" style="margin-top:12px"><button class="btn small ghost" id="oneoff">${S.ui.oneoff ? 'Hide' : 'Show'} some one-off answers</button> <span class="tiny">Check them on your own screen before projecting.</span></div>
      ${S.ui.oneoff ? `<div class="oneoff">${shuffle(others, rng(3)).slice(0, 14).map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
      ${tutor('Statistical rarity depends on who is in the sample: "pizza oven" might be rare in one tutorial and common in another, so the same answer scores differently. And the categories here were decided by a keyword list someone wrote. Ask: is "throw it through a window" creative? Novel, maybe, but useful? (Creativity needs both, Lecture 9.) Who should judge? That is Amabile\'s consensual assessment.')}`);
  } else {
    const R2 = ct.rows.filter(r => fin(r.g) && fin(r.orig));
    const a = corrOf(ct.rows, 'g', 'orig'), b = corrOf(ct.rows, 'g', 'flu'), c = corrOf(ct.rows, 'cr', 'orig');
    body.push(`<div class="label">Reveal 2c</div><h1>Is creativity separate from g?</h1>
      <p class="prompt">Your thinking-task composite (g) against your total originality score on the brick task.</p>${enough(R2.length, 12)}
      ${scatter({ W:900, H:420, pts: R2.map(r => ({ x:r.g, y:r.orig })), x0:-2.5, x1:2.5, y0:0, y1:Math.max(6, ...R2.map(r => r.orig)) + 1, xTicks:tick(-2, 2, 1), yTicks:tick(0, 20, 2), xLabel:'g composite (average z-score on the three thinking tasks)', yLabel:'Originality: total score', jitter:.05, fit:true })}
      ${keystats([{ n: fmtR(a.r), l:'g with originality' }, { n: fmtR(b.r), l:'g with fluency' }, { n: fmtR(c.r), l:'"I am creative" with originality' }])}
      ${tutor('Lecture 9: creativity is partly dependent on g, but not reducible to it, and personality (openness) is its strongest trait correlate. The threshold hypothesis (below about IQ 120 the link is stronger) cannot be tested here: we have 30 people and no real IQ scores. Ask: what sample would you need? Also note whether self-rated creativity tracked actual output, an echo of reveal 1d.')}`);
  }
  return t.html + body.join('');
}

/* ---------- Courtroom ---------- */
function stageCourt(){
  const teams = allTeams(), n = nTeams();
  const left = S.ui.clock ? S.ui.clock - Date.now() : null;
  return `<div class="label">The scorecard · about 10 minutes</div><h1>Put a candidate on trial</h1>
    <p class="prompt">Each team scores one candidate against the six criteria from Lectures 7 to 9, and designs the one study that would convince a sceptic. Use today's data where you can.</p>
    <table class="lb" style="font-size:16px"><tr><th>Team</th><th>Candidate</th><th class="r">Status</th></tr>
      ${TEAM_NAMES.slice(0, n).map(T => `<tr><td>Team ${T}</td><td>${candFor(T).name}</td><td class="r">${teams[T] && teams[T].done ? 'submitted' : teams[T] && teams[T].card ? 'working…' : '–'}</td></tr>`).join('')}</table>
    <div class="grid6">${CRIT.map((c, i) => `<div class="c"><div class="n">0${i + 1}</div><h3>${c.n}</h3><p>${c.d}</p></div>`).join('')}</div>
    <div class="row" style="margin-top:16px;align-items:center"><div class="clock" id="clock">${left == null ? '10:00' : fmtTime(left / 1000)}</div><button class="btn small ghost controls" id="clockGo" style="border-top:1px solid var(--line)">${S.ui.clock ? 'Reset timer' : 'Start 10-minute timer'}</button></div>
    ${tutor('Circulate. Push teams on "No evidence" versus "Fails": absence of evidence is not evidence of absence. Teams with trait EI, ability EI and creativity should cite the reveals. For incremental validity, ask "beyond g <em>and</em> personality?" The AI-prompting team has no lecture to lean on; that is the point.')}`;
}
function stageCross(){
  const t = tabs('cross', PHASES.find(p => p.id === 'cross').reveal);
  const teams = allTeams(), list = TEAM_NAMES.slice(0, nTeams());
  if (t.cur === 'lect'){
    return t.html + `<div class="label">For comparison</div><h1>What the lectures concluded</h1>
      <table class="lb vt"><tr><th>Candidate</th><th>Lecture verdict</th></tr>
      ${list.map(T => { const c = candFor(T); return `<tr><td style="width:24%"><strong>${c.name}</strong><div class="tiny">Team ${T}</div></td><td>${c.lecture}</td></tr>`; }).join('')}</table>
      ${tutor('Where did a team disagree with the lecture? Disagreement backed by a good argument is a better outcome than agreement by recall. Close with the transferable skill from Lecture 8: this scorecard works for any new construct claim, from "grit" to "AI literacy".')}`;
  }
  const sym = v => { const x = VERD.find(q => q[0] === v); return x ? `<span class="sym ${v}">${x[2]}</span>` : '<span class="sym unknown">·</span>'; };
  const ov = v => { const x = OVERALL.find(q => q[0] === v); return x ? x[1] : '–'; };
  const pair = list.map((T, i) => `Team ${list[(i + 1) % list.length]} questions Team ${T}`).join(' · ');
  return t.html + `<div class="label">Cross-examination</div><h1>Defend your verdict</h1>
    <p class="prompt">Each team has 60 seconds to present its case. The next team gets one question to attack it. ${list.length > 1 ? `<br><span class="tiny">${pair}</span>` : ''}</p>
    <table class="lb vt"><tr><th>Candidate</th>${CRIT.map(c => `<th class="r" style="text-align:center">${c.n}</th>`).join('')}<th>Verdict</th></tr>
    ${list.map(T => { const c = candFor(T), card = (teams[T] && teams[T].card) || {}; return `<tr><td><strong>${c.name}</strong><div class="tiny">Team ${T}</div></td>${CRIT.map(cr => `<td class="sym">${sym(card[cr.id])}</td>`).join('')}<td>${ov(card.overall)}</td></tr>
      ${card.study ? `<tr><td></td><td colspan="${CRIT.length + 1}" class="tiny" style="color:var(--muted);font-size:14px">Study: ${esc(card.study)}</td></tr>` : ''}`; }).join('')}</table>
    <p class="tiny" style="margin-top:8px">${VERD.map(([k, l, s]) => s + ' ' + l).join(' · ')}</p>
    ${tutor('Good cross-examination questions: "Is that a factor separate from g, or just g applied to new content?" "Beyond g <em>and</em> personality?" "Would your study tell apart an intelligence from expertise?" Keep it moving: about 8 minutes for six teams. Then switch to the lecture verdicts tab.')}`;
}
function stageEnd(){
  const h = pollHist();
  return `<div class="label">Wrap-up</div><h1>Smart at what, measured how, and how do we know?</h1>
    <p class="prompt">Today the same people gave different answers about "emotional intelligence" and "creativity" depending on how we measured them. The measure shapes the conclusion.</p>
    ${h.html}
    ${tutor('Three take-homes: (1) the positive manifold showed up even in a few minutes of tasks; (2) ability and trait EI are different constructs with different profiles, and self-ratings are not abilities; (3) scoring choices (count vs proportion) changed who looked creative. Exam tip: when you meet any claim of a new intelligence, run the six criteria.')}`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  if (!S.code){ render(); return; }
  $('#tag').textContent = 'Session ' + S.code + (S.local ? ' · offline' : '');
  S.pid = S.host ? 'host' : getPid();
  try { S.db = S.local ? makeLocalDB(S.code) : await makeFirebaseDB(S.code); }
  catch(e){ showError(e); return; }
  let first = true;
  S.db.onSession(s => {
    S.session = s;
    if (S.host && !s && first){ S.db.setSession({ phase:'lobby', nTeams:6, created:Date.now() }).catch(showError); }
    first = false; render();
  }, showError);
  S.db.onResps(o => {
    S.resps = o || {};
    if (!S.host){ const mine = S.resps[S.pid]; if (mine) S.me = deepMerge(mine, S.me); }
    render();
  }, showError);
  S.db.onTeams(o => { S.teams = o || {}; render(); }, showError);
  const resync = async () => {
    try {
      const s = await S.db.getSession();
      if (s && JSON.stringify(s) !== JSON.stringify(S.session)){ S.session = s; render(); }
      if (curPhase() === 'court'){ const t = await S.db.getTeams(); if (JSON.stringify(t) !== JSON.stringify(S.teams)){ S.teams = t; render(); } }
    } catch(e){}
  };
  if (!S.host){ setInterval(() => { if (!document.hidden) resync(); }, 5000); setTimeout(() => render(), 8500); setInterval(tickTimer, 250); }
  else setInterval(() => { const el = $('#clock'); if (el && S.ui.clock){ const left = S.ui.clock - Date.now(); el.textContent = fmtTime(left / 1000); el.style.color = left <= 0 ? 'var(--accent)' : ''; } }, 500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resync(); });
  window.addEventListener('focus', resync);
  if (S.host) document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'p' || e.key === 'P') document.body.classList.toggle('present');
    if (/^[1-9]$/.test(e.key)){ const t = document.querySelectorAll('[data-tab]')[Number(e.key) - 1]; if (t) t.click(); }
    const ci = PHASES.findIndex(p => p.id === curPhase());
    if (e.key === 'ArrowRight' && ci < PHASES.length - 1) S.db.setSession({ phase:PHASES[ci + 1].id });
    if (e.key === 'ArrowLeft' && ci > 0) S.db.setSession({ phase:PHASES[ci - 1].id });
  });
}
boot();
