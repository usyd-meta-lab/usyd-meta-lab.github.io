<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reading the Mind in the Eyes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e64626'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --accent:#e64626; --accent-dark:#b8321a; --accent-soft:#fdece7;
  --ink:#000; --muted:#414141; --light:#8a8a8a; --line:#d9d9d9; --soft:#f6f6f6; --bg:#fff; --ok:#1f7a4d; --ok-soft:#e6f3ec;
  --serif:'Times New Roman', Times, serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace;
  --sans:Arial,'Helvetica Neue',Helvetica,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.top{border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:13px;color:var(--accent)}
.brand b{color:var(--muted);font-weight:400}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px}
.wrap{max-width:620px;margin:0 auto;padding:22px 18px 70px}
.wrap.host{max-width:1400px;padding:18px 24px 50px}
h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin:0 0 10px}
h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15;margin:0 0 8px}
.label{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted)} .tiny{font-size:12.5px;color:var(--light)}
.lede{font-size:18px;color:var(--muted);margin-bottom:18px}
.card{border:1px solid var(--line);padding:20px;margin:0 0 16px;background:#fff}
.card.soft{background:var(--soft)}
.btn{display:inline-block;background:var(--accent);color:#fff;border:1px solid var(--accent);padding:12px 18px;font-size:15px;text-decoration:none;text-align:center}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.big{padding:16px 30px;font-size:18px}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{display:block;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.prog{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.bar{height:3px;background:var(--line);margin-bottom:18px}.bar i{display:block;height:3px;background:var(--accent)}
.eyes{display:block;width:100%;height:auto;border:1px solid var(--line);background:#111}
.q{font-family:var(--serif);font-size:22px;line-height:1.2;margin:14px 0 14px}
.opts{display:grid;gap:10px}
.opt{position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;padding:15px 16px;text-align:left;font-size:18px;display:flex;align-items:center;gap:10px;width:100%}
button.opt:hover{border-color:var(--ink)}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:#ececec;transition:width .45s ease;z-index:0}
.opt > *:not(.fill){position:relative;z-index:1}
.opt .w{flex:1}
.opt .pc{font-family:var(--mono);font-size:14px;color:var(--muted)}
.opt.mine{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.opt.mine .fill{background:var(--accent-soft)}
.opt.key{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.key .fill{background:var(--ok-soft)}
.opt.dim{color:var(--light)}
.star{color:var(--ok);font-weight:700}
.you{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);padding:1px 6px}
.verdict{padding:14px 16px;margin:14px 0 0;border-left:3px solid var(--line);background:var(--soft)}
.verdict.ok{border-color:var(--ok);background:var(--ok-soft)} .verdict.no{border-color:var(--accent);background:var(--accent-soft)}
.center{text-align:center}
.codebox{font-family:var(--mono);font-size:34px;letter-spacing:.2em;border:1px solid var(--line);padding:10px 16px;display:inline-block}
input.code{font-family:var(--mono);font-size:22px;letter-spacing:.2em;text-transform:uppercase;padding:12px;border:1px solid var(--line);width:100%;margin-bottom:10px}
.banner{border:1px solid var(--accent);background:var(--accent-soft);padding:14px 16px;margin-bottom:16px;font-size:14px}
.banner pre{font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--line);padding:10px;margin-top:8px;overflow:auto}
.foot{font-size:12px;color:var(--light);margin-top:26px}
/* host */
.hgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.hgrid .q{font-size:30px;margin-top:0}
.hgrid .opt{font-size:30px;padding:20px 22px}
.hgrid .opt .pc{font-size:22px}
.hbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.hstat{font-family:var(--mono);font-size:14px;color:var(--muted)}
.qrbox{display:inline-block;padding:10px;background:#fff;border:1px solid var(--line)}
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center;padding-top:20px}
.lobby h1{font-size:54px}
table.sum{border-collapse:collapse;width:100%;font-size:17px}
table.sum th{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)}
table.sum td{padding:10px;border-bottom:1px solid var(--line)}
.pill{white-space:nowrap;font-family:var(--mono);font-size:11px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{border-color:var(--accent);color:var(--accent)}
.hist{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.hist div{flex:1;background:var(--accent);min-height:2px;position:relative}
.hist span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.opt .letter{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:#fff;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opts.long .opt{font-size:17px;line-height:1.3;align-items:flex-start;padding:14px 16px}
.opts.long .opt .pc{padding-top:2px}
.hgrid .opts.long .opt{font-size:21px;padding:16px 18px}
.hgrid .opts.long .opt .pc{font-size:20px}
.opt.modal{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opt.modal .fill{background:#e2e2e2}
.tags{display:flex;gap:8px;align-items:center;margin-top:6px}
.modalt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);font-weight:700;white-space:nowrap}
.stem{border:1px solid var(--line);background:var(--soft);padding:26px 28px}
.stem .t{font-family:var(--serif);font-size:30px;line-height:1.25;margin-top:10px}
.stem.s .t{font-size:21px}
.spread{display:flex;gap:4px;align-items:flex-end;height:34px}
.spread i{display:block;width:22px;background:var(--accent);min-height:2px}
.prompt{border-left:3px solid var(--accent);padding:10px 16px;margin:10px 0;font-family:var(--serif);font-size:22px}
@media(max-width:900px){.hgrid,.lobby{grid-template-columns:1fr}.lobby h1{font-size:38px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* =====================================================================
   CONFIG
   Items from the Reading the Mind in the Eyes Test, revised version
   (Baron-Cohen, Wheelwright, Hill, Raste & Plumb, 2001). Used for teaching.
   `key` is the index (0 to 3) of the keyed answer. Item 0 is the practice item.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBaz1nWglmiKv9W_MrbulS__h8aieCPPE8",
  authDomain: "meetings-b9e5e.firebaseapp.com",
  projectId: "meetings-b9e5e",
  storageBucket: "meetings-b9e5e.firebasestorage.app",
  messagingSenderId: "368747163289",
  appId: "1:368747163289:web:29719439e3b61126331208"
};
const ROOT = 'rmet_demo';
const BUILD = '2026-11-03d'; // bump on every change: the presenter publishes it, student pages reload themselves if theirs differs
const IMG_DIR = 'img/';
const RMET = [{"id": 0, "opts": ["jealous", "panicked", "arrogant", "hateful"], "key": 1}, {"id": 1, "opts": ["playful", "comforting", "irritated", "bored"], "key": 0}, {"id": 2, "opts": ["terrified", "upset", "arrogant", "annoyed"], "key": 1}, {"id": 3, "opts": ["joking", "flustered", "desire", "convinced"], "key": 2}, {"id": 4, "opts": ["joking", "insisting", "amused", "relaxed"], "key": 1}, {"id": 5, "opts": ["irritated", "sarcastic", "worried", "friendly"], "key": 2}, {"id": 6, "opts": ["aghast", "fantasizing", "impatient", "alarmed"], "key": 1}, {"id": 7, "opts": ["apologetic", "friendly", "uneasy", "dispirited"], "key": 2}, {"id": 8, "opts": ["despondent", "relieved", "shy", "excited"], "key": 0}];
/* Tacit knowledge scenarios: written for this demo in the style of Sternberg's tacit knowledge
   inventories (they are not items from the published inventories). `key` is the presenter's expert
   answer (index 0 to 3). The class favourite is shown beside it, so the two can be compared. */
const TACIT = [
  { id:'T1', key:1, title:'Group assignment',
    stem:'You are in a group of four for an assessment due in a week. One member has contributed nothing and has stopped replying in the group chat. The others are frustrated, and you have ended up coordinating the work. What is the best response?',
    opts:['Post in the group chat that someone is not pulling their weight and ask them to explain.',
          'Message them privately, ask if something is going on, and offer a small, specific task with a deadline.',
          'Quietly split their share among the rest of you, and mention it to the tutor only if the mark is affected.',
          'Wait until a few days before the deadline, then email the tutor to ask how to handle it.'] },
  { id:'T2', key:2, title:'Two urgent requests',
    stem:'You work part time in a busy office. Your manager asks you to finish a report by 3 pm. At 1 pm a senior colleague from another team asks you for a different task "as soon as possible". You cannot do both in time. What is the best response?',
    opts:['Finish the report first, since your manager asked first, and tell the colleague you will be late.',
          'Do the colleague\'s task first because they are more senior.',
          'Tell your manager about the clash and ask which should come first, copying the colleague in.',
          'Start with whichever task is quicker, then do the other, and explain afterwards only if asked.'] },
  { id:'T3', key:1, title:'Vague feedback',
    stem:'Your supervisor returns a draft with a single comment: "This isn\'t quite working." You have a meeting with them in two days. What is the best response?',
    opts:['Ask for a short meeting now and ask which parts are not working and why.',
          'Revise the sections you were least sure about and bring the new version to the meeting.',
          'Show the draft to a more experienced student or postdoc to get their read before replying.',
          'Wait for the meeting and ask for details then.'] },
  { id:'T4', key:1, title:'Credit for an idea',
    stem:'In a team meeting, a senior colleague presents an idea you suggested to them last week as if it were their own. Nobody else knows it was yours. What is the best response?',
    opts:['Say in the meeting, politely, that this builds on the idea you raised with them last week.',
          'Speak to the colleague privately afterwards and ask how they plan to acknowledge it.',
          'Say nothing, and focus on being known for good ideas over time.',
          'Email the group a summary of the idea and how it developed, noting when you first suggested it.'] }
];
const ITEMS = [...RMET.map(x => ({ ...x, type:'rmet', seg:'rmet' })), ...TACIT.map(x => ({ ...x, type:'tacit', seg:'tacit' }))];
const N = ITEMS.length;
const SEG = {
  rmet:  { name:'Reading the Mind in the Eyes', q:'Which word best describes what this person is thinking or feeling?' },
  tacit: { name:'Tacit knowledge',              q:'Which response would be best?' }
};
const segItems = s => ITEMS.filter(it => it.seg === s);
const scoredIn = s => segItems(s).filter(it => it.type === 'tacit' || it.id !== 0);
const imgSrc = it => IMG_DIR + String(it.id).padStart(3, '0') + '.jpg';

/* =====================================================================
   UTILITIES
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => Number.isFinite(x) ? Math.round(x * 100) + '%' : '0%';
function deepMerge(t, s){ const out = { ...(t || {}) }; for (const k in s){ const v = s[k]; out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(out[k], v) : v; } return out; }
const itemLabel = it => it.type === 'tacit' ? 'Scenario ' + (segItems('tacit').indexOf(it) + 1) : (it.id === 0 ? 'Practice' : 'Item ' + it.id);
const progLabel = it => it.type === 'tacit' ? 'SCENARIO ' + (segItems('tacit').indexOf(it) + 1) + ' OF ' + segItems('tacit').length : (it.id === 0 ? 'PRACTICE (NOT SCORED)' : 'ITEM ' + it.id + ' OF ' + scoredIn('rmet').length);
const segPos = it => { const a = segItems(it.seg); return (a.indexOf(it) + 1) / a.length; };

/* =====================================================================
   DATA LAYER (Firestore, or localStorage for offline rehearsal)
   ===================================================================== */
async function makeFirebaseDB(code){
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
  const fs = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
  const app = initializeApp(firebaseConfig, 'rmet');
  const db = fs.initializeFirestore(app, { experimentalForceLongPolling: true });
  const sRef = fs.doc(db, ROOT, code);
  const rCol = fs.collection(db, ROOT, code, 'resp');
  return {
    setSession: p => fs.setDoc(sRef, p, { merge:true }),
    onSession: (cb, err) => fs.onSnapshot(sRef, s => cb(s.exists() ? s.data() : null), err),
    setResp: (id, p) => fs.setDoc(fs.doc(rCol, id), p, { merge:true }),
    onResps: (cb, err) => fs.onSnapshot(rCol, snap => { const o = {}; snap.forEach(d => { o[d.id] = d.data(); }); cb(o); }, err),
    clear: async () => {
      const snap = await fs.getDocs(rCol);
      await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));
      await fs.setDoc(sRef, { i:0, phase:'wait', reset:Date.now(), build:BUILD });
    }
  };
}
function makeLocalDB(code){
  const KEY = 'rmet_local_' + code;
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { session:null, resp:{} }; } catch(e){ return { session:null, resp:{} }; } };
  const subs = { session:[], resp:[] };
  const emit = () => { const d = read(); subs.session.forEach(f => f(d.session)); subs.resp.forEach(f => f(d.resp || {})); };
  window.addEventListener('storage', e => { if (e.key === KEY) emit(); });
  const write = fn => { const d = read(); fn(d); try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} setTimeout(emit, 0); return Promise.resolve(); };
  const sub = (k, cb) => { subs[k].push(cb); setTimeout(() => { const d = read(); cb(k === 'session' ? d.session : (d.resp || {})); }, 0); };
  return {
    setSession: p => write(d => { d.session = deepMerge(d.session || {}, p); }),
    onSession: cb => sub('session', cb),
    setResp: (id, p) => write(d => { d.resp = d.resp || {}; d.resp[id] = deepMerge(d.resp[id] || {}, p); }),
    onResps: cb => sub('resp', cb),
    clear: () => write(d => { d.resp = {}; d.session = { i:0, phase:'wait', reset:Date.now(), build:BUILD }; })
  };
}

/* =====================================================================
   STATE
   ===================================================================== */
const params = new URLSearchParams(location.search);
const S = {
  code: (params.get('s') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8),
  host: params.get('view') === 'host',
  local: params.get('local') === '1',
  pid: null, db: null, session: null, resps: {}, me: {},
  ui: { error:'', confirm:false, live:true, copied:false }, rt: null
};
const phase = () => (S.session && S.session.phase) || 'wait';
const curI = () => Math.min(N - 1, Math.max(0, (S.session && S.session.i) || 0));
function getPid(){
  const k = 'rmet_pid_' + S.code + (S.local ? '_l' : '');
  const store = S.local ? sessionStorage : localStorage;
  let v = null; try { v = store.getItem(k); } catch(e){}
  if (!v) v = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  try { store.setItem(k, v); } catch(e){}
  return v;
}
function joinUrl(){ const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('s', S.code); if (S.local) u.searchParams.set('local', '1'); return u.toString(); }
function tally(id){
  const c = [0, 0, 0, 0]; let n = 0;
  for (const r of Object.values(S.resps)){ const v = r && r.v && r.v[id]; if (Number.isInteger(v) && v >= 0 && v < 4){ c[v]++; n++; } }
  return { c, n };
}
const joined = () => Object.values(S.resps).filter(r => r && (r.joined || r.v)).length;
function myVote(id){ const r = S.resps[S.pid]; const v = r && r.v && r.v[id]; return Number.isInteger(v) ? v : (Number.isInteger(S.me[id]) ? S.me[id] : null); }
function modeIdx(it){ const { c, n } = tally(it.id); if (!n) return -1; return c.indexOf(Math.max(...c)); }
function modeSet(it){ const { c, n } = tally(it.id); if (!n) return []; const mx = Math.max(...c); return c.map((v, k) => v === mx ? k : -1).filter(k => k >= 0); }
// scored against the key (the test key for the eyes, the presenter's expert answer for tacit knowledge)
const target = it => it.key;
function scoresMaj(seg){
  const its = scoredIn(seg);
  return Object.values(S.resps).filter(r => r && r.v && its.some(it => Number.isInteger(r.v[it.id]))).map(r => its.reduce((s, it) => s + (r.v[it.id] === modeIdx(it) ? 1 : 0), 0));
}
function scores(seg){
  const its = scoredIn(seg);
  return Object.values(S.resps).filter(r => r && r.v && its.some(it => Number.isInteger(r.v[it.id]))).map(r => its.reduce((s, it) => s + (r.v[it.id] === target(it) ? 1 : 0), 0));
}
function showError(err){
  const denied = /permission|insufficient/i.test((err && err.message) || '');
  S.ui.error = `<div class="banner"><strong>Can't reach the live database.</strong> ${denied ? 'Firestore rejected the request: the security rules need to allow this demo\'s collection.' : 'Network or configuration error.'}
    <div class="tiny">${esc((err && err.message) || err)}</div>
    ${denied ? `<pre>match /${ROOT}/{session} {\n  allow read, write: if true;\n  match /{rest=**} {\n    allow read, write: if true;\n  }\n}</pre>` : ''}</div>`;
  render();
}

/* =====================================================================
   VIEWS
   ===================================================================== */
function topbar(){
  return `<div class="top"><div class="top-in"><div class="brand">meta lab <b>/ lecture 8 live demos</b></div>
    <div class="row">${S.code ? `<span class="tag">session ${esc(S.code)}</span>` : ''}${S.local ? '<span class="tag">local rehearsal</span>' : ''}${S.host ? `<span class="tag">${joined()} joined</span>` : ''}</div></div></div>`;
}
function plainOpts(it){
  const tacit = it.type === 'tacit';
  return `<div class="opts${tacit ? ' long' : ''}">` + it.opts.map((w, k) => `<div class="opt">${tacit ? `<span class="letter">${'ABCD'[k]}</span>` : ''}<span class="w">${esc(w)}</span></div>`).join('') + `</div>`;
}
function optsHTML(it, mode){
  // mode: 'vote' (buttons), 'live' (locked, live split), 'reveal' (key / class favourite shown)
  const { c, n } = tally(it.id);
  const mine = myVote(it.id);
  const tacit = it.type === 'tacit';
  const modal = tacit && mode === 'reveal' ? modeSet(it) : [];
  return `<div class="opts${tacit ? ' long' : ''}">` + it.opts.map((w, k) => {
    const share = n ? c[k] / n : 0;
    const showBar = mode !== 'vote';
    const isKey = mode === 'reveal' && k === it.key;
    const isModal = modal.includes(k) && n > 0;
    const isMine = !S.host && mine === k && mode !== 'vote';
    const cls = ['opt', isKey ? 'key' : '', isModal ? 'modal' : '', isMine ? 'mine' : '', (mode === 'reveal' && !tacit && !isKey) ? 'dim' : ''].join(' ');
    const inner = `${showBar ? `<span class="fill" style="width:${(share * 100).toFixed(1)}%"></span>` : ''}
      ${tacit ? `<span class="letter">${'ABCD'[k]}</span><span class="w">${esc(w)}${(isKey || isModal || isMine) ? `<span class="tags">${isKey ? '<span class="star">&#9733; expert answer</span>' : ''}${isModal ? '<span class="modalt">class favourite</span>' : ''}${isMine ? '<span class="you">you</span>' : ''}</span>` : ''}</span>` : `<span class="w">${esc(w)}</span>${isKey ? '<span class="star">&#9733; key</span>' : ''}${isMine ? '<span class="you">you</span>' : ''}`}${showBar ? `<span class="pc">${pct(share)}</span>` : ''}`;
    return mode === 'vote' ? `<button class="${cls}" data-act="vote" data-k="${k}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
  }).join('') + `</div>`;
}
function landing(){
  return topbar() + `<div class="wrap"><div class="label">Lecture 8 live demos</div><h1>Reading the Mind in the Eyes, then tacit knowledge</h1>
    <p class="lede">Join the class poll, or start a session to run it.</p>
    <div class="card"><div class="label" style="margin-bottom:8px">Join a session</div>
      <input class="code" id="joinCode" maxlength="8" placeholder="CODE" autocomplete="off">
      <button class="btn block" data-act="join">Join</button></div>
    <div class="card soft"><div class="label" style="margin-bottom:8px">Presenter</div>
      <div class="row"><button class="btn" data-act="newsession">Start a new session</button><button class="btn ghost" data-act="newlocal">Rehearse offline</button></div>
      <p class="tiny" style="margin-top:8px">Rehearse offline runs in this browser only (open the student link in a second tab). It does not touch the live database.</p></div>
    ${S.ui.error}</div>`;
}
function stimulus(it, small){
  return it.type === 'tacit'
    ? `<div class="stem ${small ? 's' : ''}"><div class="label">${esc(it.title)}</div><div class="t">${esc(it.stem)}</div></div>`
    : `<img class="eyes" src="${imgSrc(it)}" alt="Photograph of a pair of eyes">`;
}
function studentView(){
  const ph = phase(), it = ITEMS[curI()];
  let body = '';
  if (!['wait', 'vote', 'reveal', 'summary'].includes(ph)){
    body = `<div class="card center"><div class="label">Updating</div><h2>Reload this page</h2><p class="muted">The presenter moved on and this page needs refreshing. Pull down to reload, or reopen the link.</p></div>`;
  } else if (ph === 'wait' && !(S.session && S.session.started)){
    body = `<div class="card center"><div class="label">You're in</div><h2>Waiting for the presenter</h2><p class="muted">The first item will appear here. Keep this page open, there is no need to scan again.</p></div>`;
  } else if (ph === 'summary'){
    const seg = it.seg, its = scoredIn(seg);
    const mine = its.reduce((s, x) => s + (myVote(x.id) === target(x) ? 1 : 0), 0);
    const mineMaj = its.reduce((s, x) => s + (myVote(x.id) === modeIdx(x) ? 1 : 0), 0);
    const all = scores(seg); const mean = all.length ? all.reduce((a, b) => a + b, 0) / all.length : 0;
    const more = !!ITEMS[curI() + 1];
    const msg = seg === 'rmet'
      ? `<h2>You matched the key on ${mine} of ${its.length}</h2><p class="muted">Class average: ${mean.toFixed(1)} of ${its.length}.</p>
         <div class="verdict"><strong>But who decided which answer was "right"?</strong><br>The key comes from the test authors' consensus procedure. Think about how that connects to consensus scoring of emotional intelligence tests.</div>`
      : `<h2>You matched the expert answer on ${mine} of ${its.length}</h2><p class="muted">Class average: ${mean.toFixed(1)} of ${its.length}. You agreed with the class majority on ${mineMaj} of ${its.length}.</p>
         <div class="verdict"><strong>Two ways to score the same answers.</strong><br>An expert key and a majority key can disagree. Which one measures tacit knowledge?</div>`;
    body = `<div class="card"><div class="label">${esc(SEG[seg].name)}: done</div>${msg}${more ? '<p class="tiny" style="margin-top:12px">Next activity coming up. Keep this page open.</p>' : ''}</div>`;
  } else if (ph === 'wait'){
    body = `<div class="card center"><div class="label">Next up</div><h2>Hold on</h2><p class="muted">Waiting for the presenter to open the next item.</p></div>`;
  } else {
    const idx = curI(), mine = myVote(it.id), tacit = it.type === 'tacit';
    const head = `<div class="prog"><span>${progLabel(it)}</span><span>${esc(SEG[it.seg].name)}</span></div><div class="bar"><i style="width:${(segPos(it) * 100).toFixed(0)}%"></i></div>`;
    const stim = stimulus(it, true);
    if (ph === 'vote' && mine === null){
      body = `<div class="card">${head}${stim}<div class="q">${SEG[it.seg].q}</div>${optsHTML(it, 'vote')}</div>`;
    } else if (ph === 'vote'){
      const { n } = tally(it.id);
      body = `<div class="card">${head}${stim}<div class="q">Locked in. Here is how the class is voting (${n} so far).</div>${optsHTML(it, 'live')}<p class="tiny" style="margin-top:10px">${tacit ? 'The class favourite' : 'The answer'} will appear when the presenter reveals it.</p></div>`;
    } else {
      const { c, n } = tally(it.id);
      let v, q;
      if (tacit){
        const mtxt = modeSet(it).map(x => 'ABCD'[x]).join(' / ') || '-';
        const hit = mine === it.key;
        q = `The expert answer is <em>${'ABCD'[it.key]}</em>. The class favourite is <em>${mtxt}</em>.`;
        v = mine === null ? `<div class="verdict">You didn't vote on this one.</div>`
          : `<div class="verdict ${hit ? 'ok' : 'no'}"><strong>${hit ? 'You matched the expert answer.' : 'Not the expert answer.'}</strong> ${pct(n ? c[it.key] / n : 0)} of the class chose ${'ABCD'[it.key]}.</div>`;
      } else {
        const hit = mine === it.key;
        q = `The keyed answer is <em>${esc(it.opts[it.key])}</em>.`;
        v = mine === null ? `<div class="verdict">You didn't vote on this one.</div>` :
          hit ? `<div class="verdict ok"><strong>You matched the key.</strong> ${pct(n ? c[it.key] / n : 0)} of the class did.</div>`
              : `<div class="verdict no"><strong>Not the keyed answer.</strong> ${pct(n ? c[it.key] / n : 0)} of the class chose <em>${esc(it.opts[it.key])}</em>.</div>`;
      }
      body = `<div class="card">${head}${stim}<div class="q">${q}</div>${optsHTML(it, 'reveal')}${v}</div>`;
    }
  }
  return topbar() + `<div class="wrap">${S.ui.error}${body}<div class="foot">Eye items from the Reading the Mind in the Eyes Test (Baron-Cohen, Wheelwright, Hill, Raste &amp; Plumb, 2001), used here for teaching. Tacit knowledge scenarios and expert answers were written for this demo. Votes are anonymous.</div></div>`;
}
function hostView(){
  const ph = phase(), idx = curI(), it = ITEMS[idx];
  const started = ph !== 'wait' || (S.session && S.session.started);
  if (!started){
    return topbar() + `<div class="wrap host">${S.ui.error}<div class="lobby"><div class="center"><div class="qrbox" id="qr"></div><div class="tiny" style="margin-top:8px;max-width:300px;word-break:break-all">${esc(joinUrl())}</div></div>
      <div><div class="label">Lecture 8 · social intelligence</div><h1>Reading the Mind in the Eyes</h1>
      <p class="lede">Scan the code to join. Two short activities, one code: first a photograph of a pair of eyes and four words, then tacit knowledge scenarios. Votes are anonymous.</p>
      <div class="row" style="margin-bottom:18px"><span class="codebox">${esc(S.code)}</span><span class="hstat">${joined()} joined</span></div>
      <div class="row"><button class="btn big" data-act="advance">Start practice item &rarr;</button>${S.local ? '<button class="btn ghost" data-act="sim">Add 30 simulated students</button>' : ''}</div></div></div></div>`;
  }
  const resetBtn = `<button class="btn ghost small" data-act="reset">${S.ui.confirm ? 'Really reset? Click again' : 'Reset session'}</button>`;
  if (ph === 'summary'){
    const more = !!ITEMS[idx + 1];
    const nextName = more ? SEG[ITEMS[idx + 1].seg].name : '';
    return topbar() + `<div class="wrap host">${S.ui.error}${summaryHTML(it.seg)}
      <div class="hbar"><button class="btn ghost" data-act="back">&larr; Back</button>
      ${more ? `<button class="btn big" data-act="advance">Continue to ${esc(nextName.toLowerCase())} &rarr;</button>` : ''}
      <button class="btn ghost" data-act="csv">Download counts (CSV)</button><span class="spacer"></span>${resetBtn}</div>
      <div class="tiny" style="margin-top:8px">Join: ${esc(joinUrl())}</div></div>`;
  }
  const { c, n } = tally(it.id);
  const tacit = it.type === 'tacit';
  const mode = ph === 'reveal' ? 'reveal' : (S.ui.live ? 'live' : 'blind');
  const optBlock = mode === 'blind' ? plainOpts(it) : optsHTML(it, mode);
  const nx = ITEMS[idx + 1];
  const primary = ph === 'vote' ? 'Reveal the answer' : (nx && nx.seg === it.seg ? 'Next item &rarr;' : 'See results &rarr;');
  let note = '';
  if (ph === 'reveal'){
    if (tacit){
      const ms = modeSet(it), mtxt = ms.map(x => 'ABCD'[x]).join(' / ') || '-';
      const agree = ms.length === 1 && ms[0] === it.key;
      note = `<div class="verdict ${n && c[it.key] / n >= .5 ? 'ok' : 'no'}"><strong>${pct(n ? c[it.key] / n : 0)}</strong> chose the expert answer (${'ABCD'[it.key]}). Class favourite: ${mtxt}${n ? ' (' + pct(Math.max(...c) / n) + ')' : ''}.${n && !agree ? ' <strong>The class and the expert disagree.</strong>' : ''}</div>`;
    } else {
      note = `<div class="verdict ${n && c[it.key] / n >= .5 ? 'ok' : 'no'}"><strong>${pct(n ? c[it.key] / n : 0)}</strong> of the class chose the keyed answer.</div>`;
    }
  }
  const left = tacit ? stimulus(it, false) : `<img class="eyes" src="${imgSrc(it)}" alt="Photograph of a pair of eyes">`;
  return topbar() + `<div class="wrap host">${S.ui.error}
    <div class="prog"><span>${progLabel(it)}</span><span>${esc(SEG[it.seg].name)}</span></div><div class="bar"><i style="width:${(segPos(it) * 100).toFixed(0)}%"></i></div>
    <div class="hgrid"><div>${left}</div>
      <div><div class="q">${SEG[it.seg].q}</div>${optBlock}${note}</div></div>
    <div class="hbar"><button class="btn ghost" data-act="back">&larr; Back</button>
      <button class="btn big" data-act="advance">${primary}</button>
      <span class="hstat">${n} of ${joined()} voted</span><span class="spacer"></span>
      ${ph === 'vote' ? `<label class="hstat"><input type="checkbox" data-act="live" ${S.ui.live ? 'checked' : ''}> show live votes</label>` : ''}
      ${S.local ? '<button class="btn ghost small" data-act="sim">+30 simulated</button>' : ''}${resetBtn}</div>
    <div class="tiny" style="margin-top:8px">Space or &rarr; advances, &larr; goes back. Join: ${esc(joinUrl())}</div></div>`;
}
function histHTML(seg){
  const its = scoredIn(seg), all = scores(seg), max = its.length;
  const dist = Array.from({ length: max + 1 }, (_, k) => all.filter(s => s === k).length);
  const dmax = Math.max(1, ...dist);
  return `<div class="hist" style="margin-bottom:34px">${dist.map((v, k) => `<div style="height:${(v / dmax * 100).toFixed(0)}%"><span>${k}</span></div>`).join('')}</div>`;
}
function summaryHTML(seg){
  const its = scoredIn(seg), all = scores(seg), max = its.length;
  const mean = all.length ? all.reduce((a, b) => a + b, 0) / all.length : 0;
  if (seg === 'rmet'){
    const rows = its.map(it => {
      const { c, n } = tally(it.id);
      const mx = Math.max(...c);
      const tops = c.map((v, k) => v === mx ? k : -1).filter(k => k >= 0);
      const share = n ? c[it.key] / n : 0;
      let flag = '';
      if (n){
        if (tops.length > 1) flag = '<span class="pill warn">tied</span>';
        else if (tops[0] !== it.key) flag = '<span class="pill warn">class favoured another word</span>';
        else if (c[tops[0]] / n < .6) flag = '<span class="pill warn">split</span>';
      }
      const most = n ? tops.map(k => esc(it.opts[k])).join(' / ') + ' (' + pct(mx / n) + (tops.length > 1 ? ' each' : '') + ')' : '-';
      return `<tr><td>${it.id}</td><td>${esc(it.opts[it.key])}</td><td>${pct(share)}</td><td>${most}</td><td>${flag}</td></tr>`;
    }).join('');
    return `<div class="label">Results · ${esc(SEG[seg].name)}</div><h1>How the class did</h1>
      <p class="lede">${all.length} students. Mean ${mean.toFixed(1)} of ${max} matching the key.</p>
      <div class="hgrid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div><table class="sum"><thead><tr><th>Item</th><th>Keyed word</th><th>Chose key</th><th>Most chosen</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div><div class="label">Score distribution (matches with the key)</div>${histHTML(seg)}
      <div class="prompt">Who decided which word is correct, and what would we conclude if the key were wrong?</div>
      <div class="prompt" style="font-size:18px">If this is a social intelligence ability, how would you show it is separable from vocabulary and g?</div></div></div>`;
  }
  const rows = its.map(it => {
    const { c, n } = tally(it.id);
    const ms = modeSet(it);
    const top = n ? Math.max(...c) / n : 0;
    const agree = ms.length === 1 && ms[0] === it.key;
    const flag = !n ? '' : (!agree ? '<span class="pill warn">room differs from expert</span>' : '');
    const spread = `<div class="spread">${c.map((v, k) => `<i style="height:${n ? Math.max(2, v / n * 34) : 2}px;${k === it.key ? 'background:var(--ok)' : ''}" title="${v}"></i>`).join('')}</div>`;
    return `<tr><td>${esc(it.title)}</td><td>${'ABCD'[it.key]}</td><td>${pct(n ? c[it.key] / n : 0)}</td><td>${n ? ms.map(x => 'ABCD'[x]).join(' / ') + ' (' + pct(top) + ')' : '-'}</td><td>${spread}</td><td>${flag}</td></tr>`;
  }).join('');
  const maj = scoresMaj(seg); const meanMaj = maj.length ? maj.reduce((a, b) => a + b, 0) / maj.length : 0;
  return `<div class="label">Results · ${esc(SEG[seg].name)}</div><h1>Expert key versus the room</h1>
    <p class="lede">${all.length} students. Mean ${mean.toFixed(1)} of ${max} matching the expert answers, and ${meanMaj.toFixed(1)} of ${max} agreeing with the class majority.</p>
    <div class="hgrid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div><table class="sum"><thead><tr><th>Scenario</th><th>Expert</th><th>Chose expert</th><th>Class favourite</th><th>Spread A to D</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div><div class="label">Score distribution (matches with the expert answers)</div>${histHTML(seg)}
    <div class="prompt">Where the room and the expert disagree, who is right?</div>
    <div class="prompt" style="font-size:18px">Would a different panel of experts have keyed these the same way? Is this expertise, or experience plus personality plus g?</div></div></div>`;
}


/* =====================================================================
   RENDER + ACTIONS
   ===================================================================== */
function render(){ clearTimeout(S.rt); S.rt = setTimeout(doRender, 60); }
function doRender(){
  const app = $('#app');
  const ae = document.activeElement; const typing = ae && ae.tagName === 'INPUT' && ae.type !== 'checkbox';
  if (typing) return;
  app.innerHTML = !S.code ? landing() : (S.host ? hostView() : studentView());
  const qr = $('#qr');
  if (qr && window.QRCode){ qr.innerHTML = ''; new QRCode(qr, { text: joinUrl(), width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M }); }
  else if (qr) qr.innerHTML = '<div class="tiny" style="padding:20px">QR library not loaded. Use the link below.</div>';
  // preload neighbours
  if (S.session){ const i = curI(); [i + 1].forEach(j => { if (ITEMS[j] && ITEMS[j].type === 'rmet'){ const im = new Image(); im.src = imgSrc(ITEMS[j]); } }); }
}
const newCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
function go(code, host, local){ const u = new URL(location.href); u.search = ''; u.searchParams.set('s', code); if (host) u.searchParams.set('view', 'host'); if (local) u.searchParams.set('local', '1'); location.href = u.toString(); }

function advance(){
  const ph = phase(), i = curI();
  if (ph === 'wait') return S.db.setSession({ phase:'vote', i:0, started:true });
  if (ph === 'vote') return S.db.setSession({ phase:'reveal' });
  if (ph === 'reveal'){ const nx = ITEMS[i + 1]; return (!nx || nx.seg !== ITEMS[i].seg) ? S.db.setSession({ phase:'summary' }) : S.db.setSession({ phase:'vote', i:i + 1 }); }
  if (ph === 'summary' && ITEMS[i + 1]) return S.db.setSession({ phase:'vote', i:i + 1 });
}
function back(){
  const ph = phase(), i = curI();
  if (ph === 'summary') return S.db.setSession({ phase:'reveal' });
  if (ph === 'reveal') return S.db.setSession({ phase:'vote' });
  if (ph === 'vote'){
    if (i === 0) return S.db.setSession({ phase:'wait', started:false });
    return ITEMS[i - 1].seg !== ITEMS[i].seg ? S.db.setSession({ phase:'summary', i:i - 1 }) : S.db.setSession({ phase:'reveal', i:i - 1 });
  }
}
function simulate(){
  const r = () => Math.random();
  const W = [[.12, .5, .23, .15], [.45, .1, .3, .15], [.5, .2, .1, .2], [.2, .3, .15, .35]];
  for (let s = 0; s < 30; s++){
    const v = {};
    ITEMS.forEach((it, ix) => {
      if (it.type === 'tacit'){ const w = W[ix % 4]; let x = r(), k = 0; while (k < 3 && x > w[k]){ x -= w[k]; k++; } v[it.id] = k; }
      else { const hit = r() < (it.id === 0 ? .8 : .65); v[it.id] = hit ? it.key : ((it.key + 1 + Math.floor(r() * 3)) % 4); }
    });
    S.db.setResp('sim' + s + '_' + Date.now().toString(36), { joined:true, sim:true, v });
  }
}
function csv(){
  const q = x => '"' + String(x).replace(/"/g, '""') + '"';
  let out = 'activity,item,keyed_option,' + [1, 2, 3, 4].map(k => 'option' + k + '_text,option' + k + '_n').join(',') + ',n_votes,pct_chose_key,class_favourite\n';
  ITEMS.forEach(it => {
    const { c, n } = tally(it.id); const tac = it.type === 'tacit';
    out += [SEG[it.seg].name, it.id, it.opts[it.key], ...[0, 1, 2, 3].flatMap(k => [q(it.opts[k]), c[k]]), n, n ? (c[it.key] / n).toFixed(3) : '', n ? 'ABCD'[modeIdx(it)] : ''].map((x, i) => (i === 2 && x !== '') ? q(x) : x).join(',') + '\n';
  });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type:'text/csv' })); a.download = 'lecture8_demo_' + S.code + '.csv'; a.click();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'join'){ const c = ($('#joinCode').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c) go(c, false, false); }
  else if (act === 'newsession') go(newCode(), true, false);
  else if (act === 'newlocal') go(newCode(), true, true);
  else if (act === 'vote'){ const it = ITEMS[curI()]; const k = +t.dataset.k; if (myVote(it.id) !== null) return; S.me[it.id] = k; S.db.setResp(S.pid, { joined:true, v:{ [it.id]:k } }); render(); }
  else if (act === 'advance') advance();
  else if (act === 'back') back();
  else if (act === 'sim') simulate();
  else if (act === 'csv') csv();
  else if (act === 'live'){ S.ui.live = t.checked; render(); }
  else if (act === 'reset'){
    if (!S.ui.confirm){ S.ui.confirm = true; render(); setTimeout(() => { S.ui.confirm = false; render(); }, 4000); }
    else { S.ui.confirm = false; S.db.clear().then(() => render()); }
  }
});
document.addEventListener('keydown', e => {
  if (!S.host || !S.db || (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox')) return;
  if (e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); back(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'joinCode'){ const c = (e.target.value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c) go(c, false, false); } });

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  if (!S.code){ render(); return; }
  S.pid = getPid();
  try { S.db = S.local ? makeLocalDB(S.code) : await makeFirebaseDB(S.code); }
  catch(err){ showError(err); return; }
  S.db.onSession(s => {
    S.session = s;
    if (S.host && s && s.build !== BUILD) S.db.setSession({ build:BUILD });
    if (!S.host && s && s.build && s.build !== BUILD){
      // this page is a stale cached copy: reload once, bypassing the cache with a changed query string
      let done = false; const fk = 'rmet_reloaded_' + s.build;
      try { done = !!sessionStorage.getItem(fk); sessionStorage.setItem(fk, '1'); } catch(e){}
      if (!done){ const u = new URL(location.href); u.searchParams.set('b', s.build); location.replace(u.toString()); return; }
    }
    const rs = (s && s.reset) || 0;
    if (S.lastReset !== undefined && rs !== S.lastReset){ S.me = {}; if (!S.host) S.db.setResp(S.pid, { joined:true, t:Date.now() }); }
    S.lastReset = rs;
    if (S.host && !s) S.db.setSession({ i:0, phase:'wait', started:false, build:BUILD });
    render();
  }, showError);
  S.db.onResps(r => { S.resps = r || {}; render(); }, showError);
  if (!S.host) S.db.setResp(S.pid, { joined:true, t:Date.now() }).catch(showError);
  render();
})();
</script>
